name: Compare BeltMap Brick 10g/s configurations

run-name: >-
  Brick comparison max_frames=${{ inputs.max_frames || '1000' }}
  stride=${{ inputs.frame_stride || '1' }}
  velocity=${{ inputs.belt_velocity_px_per_frame || '59.3' }}

on:
  workflow_dispatch:
    inputs:
      max_frames:
        description: "Frames per variant. Use a short run first; 0 processes all selected frames."
        required: true
        type: string
        default: "1000"
      frame_stride:
        description: "Process every Nth frame after natural sorting."
        required: true
        type: string
        default: "1"
      belt_region:
        description: "Crop: top,left,height,width. Default is the known Brick belt ROI."
        required: true
        type: string
        default: "0,220,1330,1800"
      belt_velocity_px_per_frame:
        description: "Belt image velocity in px/frame, or 'auto'."
        required: true
        type: string
        default: "59.3"
      belt_period_px:
        description: "Optional belt period/circumference in pixels. Empty = infer sequence map."
        required: false
        type: string
        default: "14723"
      detection_threshold:
        description: "Default threshold on normalized residual for bright brick particles."
        required: true
        type: string
        default: "5.0"
      min_area_px:
        description: "Default minimum connected-component particle area."
        required: true
        type: string
        default: "4"
      min_track_length:
        description: "Minimum detections per track for velocity output."
        required: true
        type: string
        default: "2"
      map_sample_frames:
        description: "Number of frames sampled to build the belt map."
        required: true
        type: string
        default: "120"
      debug_residual_preview_interval_frames:
        description: "Also save residual previews every N frames. 0 = disabled."
        required: true
        type: string
        default: "250"
      truth_path:
        description: "Optional checked-out JSON labels path for sparse real-data evaluation. Empty disables labeled metrics."
        required: false
        type: string
        default: ""
      truth_iou_threshold:
        description: "IoU threshold for optional sparse real-data evaluation."
        required: true
        type: string
        default: "0.25"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_NO_INTERACTION: "1"
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Validate Zenodo URL is reachable
        env:
          DATASET_URL: "https://zenodo.org/records/7802579/files/images_Brick_10gpers.zip?download=1"
        run: curl -L --fail --head --retry 3 --retry-delay 5 --connect-timeout 30 "$DATASET_URL"
      - name: Install and test package
        run: |
          rm -rf .venv
          poetry install --with test --extras speed
          poetry run pytest -q

  compare-beltmap:
    name: Compare ${{ matrix.variant }}
    needs: preflight
    runs-on: [self-hosted, Linux]
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: baseline
            params_json: '{"static_noise":["0","0","0","8","4"],"static_background":["0","0","8","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: huber-map
            params_json: '{"map":["huber","1","3.0","1.0"],"static_noise":["0","0","0","8","4"],"static_background":["0","0","8","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: photometric
            params_json: '{"photometric":["true","0.05","3","10000"],"static_noise":["0","0","0","8","4"],"static_background":["0","0","8","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: huber-photometric
            params_json: '{"map":["huber","1","3.0","1.0"],"photometric":["true","0.05","3","10000"],"static_noise":["0","0","0","8","4"],"static_background":["0","0","8","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: static-bg
            params_json: '{"static_noise":["0","0","0","8","4"],"static_background":["120","4.0","16","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: static-bg-threshold-6
            params_json: '{"detection_threshold":"6.0","static_noise":["0","0","0","8","4"],"static_background":["120","4.0","16","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: static-bg-minarea-6
            params_json: '{"min_area_px":"6","static_noise":["0","0","0","8","4"],"static_background":["120","4.0","16","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: static-noise-bg
            params_json: '{"static_noise":["120","0.5","4.0","16","4"],"static_background":["120","4.0","16","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: phase-refined-map
            params_json: '{"static_noise":["0","0","0","8","4"],"static_background":["0","0","8","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["12.0","0.5"],"phase_refinement":["1","0.0","4","25"]}'
          - variant: recurrent-soft
            params_json: '{"static_noise":["0","0","0","8","4"],"static_background":["0","0","8","4"],"recurrent_artifact":["2","4","0.3","soft","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
      - name: Install BeltMap and runtime dependencies
        run: |
          rm -rf .venv
          poetry install --with test --extras speed
          poetry run pytest -q
      - name: Prepare Zenodo dataset from local runner dataset cache
        env:
          DATASET_URL: "https://zenodo.org/records/7802579/files/images_Brick_10gpers.zip?download=1"
        run: |
          set -euo pipefail
          DATASET_CACHE_ROOT="$HOME/.cache/datasets"
          DATASET_NAME="images_Brick_10gpers"
          CACHE_IMAGES="$DATASET_CACHE_ROOT/$DATASET_NAME"
          CACHE_ZIP="$DATASET_CACHE_ROOT/$DATASET_NAME.zip"
          CACHE_TMP="$DATASET_CACHE_ROOT/$DATASET_NAME.tmp"
          mkdir -p "$DATASET_CACHE_ROOT" data outputs
          if find -L "$CACHE_IMAGES" -type f 2>/dev/null | grep -q .; then
            echo "Local extracted dataset cache hit: $CACHE_IMAGES"
          else
            echo "Local extracted dataset cache miss or empty: $CACHE_IMAGES"
            rm -rf "$CACHE_TMP"
            mkdir -p "$CACHE_TMP"
            if [ ! -s "$CACHE_ZIP" ]; then
              rm -f "$CACHE_ZIP.tmp"
              curl -L --fail --retry 5 --retry-delay 10 --connect-timeout 30 -o "$CACHE_ZIP.tmp" "$DATASET_URL"
              mv "$CACHE_ZIP.tmp" "$CACHE_ZIP"
            fi
            poetry run python -c 'import sys; from zipfile import ZipFile; ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$CACHE_ZIP" "$CACHE_TMP"
            rm -rf "$CACHE_IMAGES"
            mv "$CACHE_TMP" "$CACHE_IMAGES"
          fi
          rm -rf data/images data/images_Brick_10gpers.zip
          ln -s "$CACHE_IMAGES" data/images
          [ ! -s "$CACHE_ZIP" ] || ln -s "$CACHE_ZIP" data/images_Brick_10gpers.zip
          echo "Dataset size summary:"
          du -shL data/images data/images_Brick_10gpers.zip 2>/dev/null || true
          echo "Number of extracted image files:"
          find -L data/images -type f | wc -l
          printf 'data/images -> %s\n' "$(readlink -f data/images)"
      - name: Write variant TOML config
        env:
          VARIANT: ${{ matrix.variant }}
          PARAMS_JSON: ${{ matrix.params_json }}
          BELT_REGION: ${{ inputs.belt_region }}
          BELT_VELOCITY_PX_PER_FRAME: ${{ inputs.belt_velocity_px_per_frame }}
          BELT_PERIOD_PX: ${{ inputs.belt_period_px }}
          DETECTION_THRESHOLD: ${{ inputs.detection_threshold }}
          MIN_AREA_PX: ${{ inputs.min_area_px }}
          MIN_TRACK_LENGTH: ${{ inputs.min_track_length }}
          MAX_FRAMES: ${{ inputs.max_frames }}
          FRAME_STRIDE: ${{ inputs.frame_stride }}
          MAP_SAMPLE_FRAMES: ${{ inputs.map_sample_frames }}
          DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES: ${{ inputs.debug_residual_preview_interval_frames }}
        run: |
          set -euo pipefail
          rm -rf outputs
          mkdir -p outputs
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def env(name: str) -> str:
              return os.environ.get(name, "").strip()

          params = json.loads(env("PARAMS_JSON"))
          static_noise = params["static_noise"]
          static_background = params["static_background"]
          recurrent_artifact = params["recurrent_artifact"]
          registration = params["registration"]
          phase_refinement = params["phase_refinement"]
          map_aggregation = params.get("map", ["mean", "0", "3.0", "1.0"])
          photometric = params.get("photometric", ["false", "0.05", "3", "10000"])
          if len(map_aggregation) != 4:
              raise SystemExit("map params must be aggregation,robust_iterations,huber_delta,min_scale")
          if map_aggregation[0] not in {"mean", "huber"}:
              raise SystemExit("map aggregation must be mean or huber")
          if len(photometric) != 4:
              raise SystemExit("photometric params must be enabled,trim_fraction,max_iterations,min_pixels")
          if photometric[0] not in {"true", "false"}:
              raise SystemExit("photometric enabled must be true or false")
          detection_threshold = params.get("detection_threshold", env("DETECTION_THRESHOLD"))
          min_area_px = params.get("min_area_px", env("MIN_AREA_PX"))

          sections = [
              ("paths", {"image_dir": "data/images", "output_dir": "outputs"}),
              ("frames", {"max_frames": env("MAX_FRAMES"), "stride": env("FRAME_STRIDE")}),
              ("belt", {"region": env("BELT_REGION"), "velocity_px_per_frame": env("BELT_VELOCITY_PX_PER_FRAME"), "period_px": env("BELT_PERIOD_PX")}),
              ("detection", {"threshold": detection_threshold, "min_area_px": min_area_px, "max_area_px": "0", "min_bbox_width_px": "0", "min_bbox_height_px": "0", "max_bbox_aspect_ratio": "0", "min_bbox_extent": "0"}),
              ("photometric", {"enabled": photometric[0], "trim_fraction": photometric[1], "max_iterations": photometric[2], "min_pixels": photometric[3]}),
              ("tracking", {"min_track_length": env("MIN_TRACK_LENGTH")}),
              ("map", {"sample_frames": env("MAP_SAMPLE_FRAMES"), "mask_iterations": "2", "particle_mask_mode": "hysteresis_abs", "particle_mask_threshold": "4.0", "particle_mask_grow_threshold": "1.5", "particle_mask_dilation_px": "24", "particle_mask_margin_px": "16", "particle_mask_min_area_px": "8", "aggregation": map_aggregation[0], "robust_iterations": map_aggregation[1], "robust_huber_delta": map_aggregation[2], "robust_min_scale": map_aggregation[3]}),
              ("static_noise", {"sample_frames": static_noise[0], "min_scale": static_noise[1], "mask_threshold": static_noise[2], "mask_margin_px": static_noise[3], "mask_min_area_px": static_noise[4]}),
              ("static_background", {"sample_frames": static_background[0], "mask_threshold": static_background[1], "mask_margin_px": static_background[2], "mask_min_area_px": static_background[3]}),
              ("recurrent_artifact", {"min_revolutions": recurrent_artifact[0], "margin_px": recurrent_artifact[1], "max_overlap_fraction": recurrent_artifact[2], "mode": recurrent_artifact[3], "soft_penalty_weight": recurrent_artifact[4]}),
              ("registration", {"search_radius_px": registration[0], "search_step_px": registration[1]}),
              ("phase_refinement", {"iterations": phase_refinement[0], "min_score": phase_refinement[1], "max_abs_correction_px": phase_refinement[2], "smoothing_window_frames": phase_refinement[3]}),
              ("auto_velocity", {"search_radius_px": "90"}),
              ("progress", {"interval_frames": "25", "partial_output_interval_frames": "250"}),
              ("debug", {"residual_preview_frames": "3", "residual_preview_interval_frames": env("DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES")}),
          ]
          lines = []
          for section, values in sections:
              lines.append(f"[{section}]")
              for key, value in values.items():
                  lines.append(f"{key} = {json.dumps(value)}")
              lines.append("")

          Path("beltmap-run.toml").write_text("\n".join(lines), encoding="utf-8")
          Path("outputs/comparison_variant.json").write_text(json.dumps({
              "variant": env("VARIANT"),
              "params": params,
              "resolved_detection_threshold": detection_threshold,
              "resolved_min_area_px": min_area_px,
              "inputs": {
                  "max_frames": env("MAX_FRAMES"),
                  "frame_stride": env("FRAME_STRIDE"),
                  "belt_region": env("BELT_REGION"),
                  "belt_velocity_px_per_frame": env("BELT_VELOCITY_PX_PER_FRAME"),
                  "belt_period_px": env("BELT_PERIOD_PX"),
                  "detection_threshold": env("DETECTION_THRESHOLD"),
                  "min_area_px": env("MIN_AREA_PX"),
                  "min_track_length": env("MIN_TRACK_LENGTH"),
                  "map_sample_frames": env("MAP_SAMPLE_FRAMES"),
                  "debug_residual_preview_interval_frames": env("DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES"),
              },
          }, indent=2), encoding="utf-8")
          print(f"Variant: {env('VARIANT')}")
          print(Path("beltmap-run.toml").read_text(encoding="utf-8"))
          PY
      - name: Run BeltMap variant
        run: poetry run beltmap-apply --config beltmap-run.toml --print-config
      - name: Generate validation report and visual QC
        if: always()
        run: poetry run beltmap-validate --output-dir outputs
      - name: Evaluate sparse real-data labels
        if: always()
        env:
          TRUTH_PATH: ${{ inputs.truth_path }}
          TRUTH_IOU_THRESHOLD: ${{ inputs.truth_iou_threshold }}
        run: |
          set -euo pipefail
          if [ -n "$TRUTH_PATH" ] && [ -f "$TRUTH_PATH" ]; then
            poetry run beltmap-evaluate-real --output-dir outputs --labels "$TRUTH_PATH" --iou-threshold "$TRUTH_IOU_THRESHOLD"
          else
            echo "No sparse label file supplied or found; skipping labeled evaluation."
          fi
      - name: Preserve generated config
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
        run: cp beltmap-run.toml "outputs/beltmap-run-${VARIANT}.toml" || true
      - name: Upload BeltMap comparison outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beltmap-brick-compare-${{ matrix.variant }}
          path: outputs/**
          if-no-files-found: warn
          retention-days: 14

  summarize-comparison:
    name: Summarize comparison
    needs: compare-beltmap
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download comparison artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: beltmap-brick-compare-*
          path: comparison-artifacts
      - name: Build comparison summary
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          rows = []
          for summary_path in sorted(Path("comparison-artifacts").glob("*/validation_summary.json")):
              artifact_dir = summary_path.parent
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              variant = artifact_dir.name.replace("beltmap-brick-compare-", "")
              variant_path = artifact_dir / "comparison_variant.json"
              if variant_path.exists():
                  variant = json.loads(variant_path.read_text(encoding="utf-8")).get("variant", variant)
              run = summary.get("run", {})
              detections = summary.get("detections", {})
              velocities = summary.get("velocities", {})
              tracks = summary.get("track_lengths", {})
              label_metrics_path = artifact_dir / "real_label_metrics.json"
              label_metrics = json.loads(label_metrics_path.read_text(encoding="utf-8")) if label_metrics_path.exists() else {}
              ratio = velocities.get("velocity_ratio_y", {})
              track_len = tracks.get("n_detections", {})
              rows.append({
                  "variant": variant,
                  "n_detections": run.get("n_detections"),
                  "n_tracks": run.get("n_tracks"),
                  "n_velocity_estimates": run.get("n_velocity_estimates"),
                  "n_filtered_velocity_estimates": run.get("n_filtered_velocity_estimates"),
                  "tracks_ge_5": tracks.get("tracks_ge_5"),
                  "tracks_ge_10": tracks.get("tracks_ge_10"),
                  "label_precision": label_metrics.get("precision"),
                  "label_recall": label_metrics.get("recall"),
                  "label_f1": label_metrics.get("f1"),
                  "median_velocity_ratio_y": ratio.get("median"),
                  "median_track_length": track_len.get("median"),
                  "zero_detection_frames": detections.get("zero_detection_frames"),
                  "artifact": artifact_dir.name,
              })

          have_labels = any(row.get("label_f1") is not None for row in rows)
          if have_labels:
              rows.sort(key=lambda row: (-(row["label_f1"] or -1), -(row["label_precision"] or -1), -(row["label_recall"] or -1), -(row["n_filtered_velocity_estimates"] or 0)))
          else:
              rows.sort(key=lambda row: (-(row["n_filtered_velocity_estimates"] or 0), -(row["tracks_ge_10"] or 0), -(row["n_detections"] or 0)))

          def fmt(value):
              if value is None:
                  return ""
              if isinstance(value, float):
                  return f"{value:.4g}"
              return str(value)

          lines = [
              "# BeltMap Brick configuration comparison",
              "",
              "| rank | variant | label F1 | label precision | label recall | detections | tracks | velocity estimates | filtered velocities | tracks >= 5 | tracks >= 10 | median velocity ratio | median track length | zero-detection frames |",
              "| ---: | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |",
          ]
          for rank, row in enumerate(rows, start=1):
              lines.append("| " + " | ".join([
                  str(rank),
                  row["variant"],
                  fmt(row["label_f1"]),
                  fmt(row["label_precision"]),
                  fmt(row["label_recall"]),
                  fmt(row["n_detections"]),
                  fmt(row["n_tracks"]),
                  fmt(row["n_velocity_estimates"]),
                  fmt(row["n_filtered_velocity_estimates"]),
                  fmt(row["tracks_ge_5"]),
                  fmt(row["tracks_ge_10"]),
                  fmt(row["median_velocity_ratio_y"]),
                  fmt(row["median_track_length"]),
                  fmt(row["zero_detection_frames"]),
              ]) + " |")
          if rows:
              criterion = "labeled F1" if have_labels else "filtered velocity estimates"
              lines += ["", f"Best by {criterion}: `{rows[0]['variant']}`.", "", "Use visual QC images in the corresponding artifact before promoting a configuration to the full run."]
          else:
              lines += ["", "No validation summaries were found."]

          Path("comparison_summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          with Path("comparison_summary.csv").open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(rows[0].keys()) if rows else ["variant"])
              writer.writeheader()
              writer.writerows(rows)
          print(Path("comparison_summary.md").read_text(encoding="utf-8"))
          PY
          cat comparison_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comparison summary
        uses: actions/upload-artifact@v7
        with:
          name: beltmap-brick-comparison-summary
          path: |
            comparison_summary.md
            comparison_summary.csv
          if-no-files-found: error
          retention-days: 14
