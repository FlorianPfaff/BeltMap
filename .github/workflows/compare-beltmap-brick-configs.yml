name: Compare BeltMap Brick 10g/s configurations

run-name: >-
  Brick comparison max_frames=${{ inputs.max_frames || '1000' }}
  stride=${{ inputs.frame_stride || '1' }}
  velocity=${{ inputs.belt_velocity_px_per_frame || '59.3' }}

on:
  workflow_dispatch:
    inputs:
      max_frames:
        description: "Frames per variant. Use a short run first; 0 processes all selected frames."
        required: true
        type: string
        default: "1000"
      frame_stride:
        description: "Process every Nth frame after natural sorting."
        required: true
        type: string
        default: "1"
      belt_region:
        description: "Crop: top,left,height,width. Default is the known Brick belt ROI."
        required: true
        type: string
        default: "0,220,1330,1800"
      belt_velocity_px_per_frame:
        description: "Belt image velocity in px/frame, or 'auto'."
        required: true
        type: string
        default: "59.3"
      belt_period_px:
        description: "Optional belt period/circumference in pixels. Empty = infer sequence map."
        required: false
        type: string
        default: "14723"
      detection_threshold:
        description: "Threshold on normalized residual for bright brick particles."
        required: true
        type: string
        default: "5.0"
      min_area_px:
        description: "Minimum connected-component particle area."
        required: true
        type: string
        default: "4"
      min_track_length:
        description: "Minimum detections per track for velocity output."
        required: true
        type: string
        default: "2"
      map_sample_frames:
        description: "Number of frames sampled to build the belt map."
        required: true
        type: string
        default: "120"
      debug_residual_preview_interval_frames:
        description: "Also save residual previews every N frames. 0 = disabled."
        required: true
        type: string
        default: "250"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_NO_INTERACTION: "1"
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
          .poetry-bootstrap/bin/poetry --version

      - name: Validate Zenodo URL is reachable
        env:
          DATASET_URL: "https://zenodo.org/records/7802579/files/images_Brick_10gpers.zip?download=1"
        run: |
          curl -L --fail --head --retry 3 --retry-delay 5 --connect-timeout 30 "$DATASET_URL"

      - name: Install and test package
        run: |
          rm -rf .venv
          poetry install --with test --extras speed
          poetry run pytest -q

  compare-beltmap:
    name: Compare ${{ matrix.variant }}
    needs: preflight
    runs-on: [self-hosted, linux]
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: baseline
            params_json: '{"static_noise":["0","0","0","8","4"],"static_background":["0","0","8","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: static-bg
            params_json: '{"static_noise":["0","0","0","8","4"],"static_background":["120","4.0","16","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: static-noise-bg
            params_json: '{"static_noise":["120","0.5","4.0","16","4"],"static_background":["120","4.0","16","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'
          - variant: phase-refined-map
            params_json: '{"static_noise":["0","0","0","8","4"],"static_background":["0","0","8","4"],"recurrent_artifact":["0","2","0.3","hard","1.0"],"registration":["12.0","0.5"],"phase_refinement":["1","0.0","4","25"]}'
          - variant: recurrent-soft
            params_json: '{"static_noise":["0","0","0","8","4"],"static_background":["0","0","8","4"],"recurrent_artifact":["2","4","0.3","soft","1.0"],"registration":["8.0","0.5"],"phase_refinement":["0","0.0","0","25"]}'

    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
          .poetry-bootstrap/bin/poetry --version

      - name: Install BeltMap and runtime dependencies
        run: |
          rm -rf .venv
          poetry install --with test --extras speed
          poetry run pytest -q

      - name: Prepare Zenodo dataset from local runner dataset cache
        env:
          DATASET_URL: "https://zenodo.org/records/7802579/files/images_Brick_10gpers.zip?download=1"
        run: |
          set -euo pipefail

          DATASET_CACHE_ROOT="$HOME/.cache/datasets"
          DATASET_NAME="images_Brick_10gpers"
          CACHE_IMAGES="$DATASET_CACHE_ROOT/$DATASET_NAME"
          CACHE_ZIP="$DATASET_CACHE_ROOT/$DATASET_NAME.zip"
          CACHE_TMP="$DATASET_CACHE_ROOT/$DATASET_NAME.tmp"

          mkdir -p "$DATASET_CACHE_ROOT" data outputs

          if find "$CACHE_IMAGES" -type f 2>/dev/null | grep -q .; then
            echo "Local extracted dataset cache hit: $CACHE_IMAGES"
          else
            echo "Local extracted dataset cache miss or empty: $CACHE_IMAGES"
            rm -rf "$CACHE_TMP"
            mkdir -p "$CACHE_TMP"
            if [ ! -s "$CACHE_ZIP" ]; then
              echo "Local dataset zip cache miss; downloading Zenodo zip to $CACHE_ZIP"
              rm -f "$CACHE_ZIP.tmp"
              curl -L --fail --retry 5 --retry-delay 10 --connect-timeout 30 \
                -o "$CACHE_ZIP.tmp" "$DATASET_URL"
              mv "$CACHE_ZIP.tmp" "$CACHE_ZIP"
            else
              echo "Local dataset zip cache hit: $CACHE_ZIP"
            fi
            echo "Extracting dataset atomically to $CACHE_IMAGES"
            poetry run python -c \
              'import sys; from zipfile import ZipFile; ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
              "$CACHE_ZIP" "$CACHE_TMP"
            rm -rf "$CACHE_IMAGES"
            mv "$CACHE_TMP" "$CACHE_IMAGES"
          fi

          rm -rf data/images data/images_Brick_10gpers.zip
          ln -s "$CACHE_IMAGES" data/images
          if [ -s "$CACHE_ZIP" ]; then
            ln -s "$CACHE_ZIP" data/images_Brick_10gpers.zip
          fi

          echo "Dataset size summary:"
          du -sh "$CACHE_IMAGES" data/images data/images_Brick_10gpers.zip 2>/dev/null || true
          echo "Number of extracted image files:"
          find data/images -type f | wc -l

      - name: Write variant TOML config
        env:
          VARIANT: ${{ matrix.variant }}
          PARAMS_JSON: ${{ matrix.params_json }}
          BELT_REGION: ${{ inputs.belt_region }}
          BELT_VELOCITY_PX_PER_FRAME: ${{ inputs.belt_velocity_px_per_frame }}
          BELT_PERIOD_PX: ${{ inputs.belt_period_px }}
          DETECTION_THRESHOLD: ${{ inputs.detection_threshold }}
          MIN_AREA_PX: ${{ inputs.min_area_px }}
          MIN_TRACK_LENGTH: ${{ inputs.min_track_length }}
          MAX_FRAMES: ${{ inputs.max_frames }}
          FRAME_STRIDE: ${{ inputs.frame_stride }}
          MAP_SAMPLE_FRAMES: ${{ inputs.map_sample_frames }}
          DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES: ${{ inputs.debug_residual_preview_interval_frames }}
        run: |
          set -euo pipefail
          rm -rf outputs
          mkdir -p outputs
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def env(name: str) -> str:
              return os.environ.get(name, "").strip()

          params = json.loads(env("PARAMS_JSON"))
          static_noise = params["static_noise"]
          static_background = params["static_background"]
          recurrent_artifact = params["recurrent_artifact"]
          registration = params["registration"]
          phase_refinement = params["phase_refinement"]

          lines = [
              "[paths]",
              'image_dir = "data/images"',
              'output_dir = "outputs"',
              "",
              "[frames]",
              f"max_frames = {json.dumps(env('MAX_FRAMES'))}",
              f"stride = {json.dumps(env('FRAME_STRIDE'))}",
              "",
              "[belt]",
              f"region = {json.dumps(env('BELT_REGION'))}",
              f"velocity_px_per_frame = {json.dumps(env('BELT_VELOCITY_PX_PER_FRAME'))}",
              f"period_px = {json.dumps(env('BELT_PERIOD_PX'))}",
              "",
              "[detection]",
              f"threshold = {json.dumps(env('DETECTION_THRESHOLD'))}",
              f"min_area_px = {json.dumps(env('MIN_AREA_PX'))}",
              'max_area_px = "0"',
              'min_bbox_width_px = "0"',
              'min_bbox_height_px = "0"',
              'max_bbox_aspect_ratio = "0"',
              'min_bbox_extent = "0"',
              "",
              "[tracking]",
              f"min_track_length = {json.dumps(env('MIN_TRACK_LENGTH'))}",
              "",
              "[map]",
              f"sample_frames = {json.dumps(env('MAP_SAMPLE_FRAMES'))}",
              'mask_iterations = "2"',
              'particle_mask_mode = "hysteresis_abs"',
              'particle_mask_threshold = "4.0"',
              'particle_mask_grow_threshold = "1.5"',
              'particle_mask_dilation_px = "24"',
              'particle_mask_margin_px = "16"',
              'particle_mask_min_area_px = "8"',
              "",
              "[static_noise]",
              f"sample_frames = {json.dumps(static_noise[0])}",
              f"min_scale = {json.dumps(static_noise[1])}",
              f"mask_threshold = {json.dumps(static_noise[2])}",
              f"mask_margin_px = {json.dumps(static_noise[3])}",
              f"mask_min_area_px = {json.dumps(static_noise[4])}",
              "",
              "[static_background]",
              f"sample_frames = {json.dumps(static_background[0])}",
              f"mask_threshold = {json.dumps(static_background[1])}",
              f"mask_margin_px = {json.dumps(static_background[2])}",
              f"mask_min_area_px = {json.dumps(static_background[3])}",
              "",
              "[recurrent_artifact]",
              f"min_revolutions = {json.dumps(recurrent_artifact[0])}",
              f"margin_px = {json.dumps(recurrent_artifact[1])}",
              f"max_overlap_fraction = {json.dumps(recurrent_artifact[2])}",
              f"mode = {json.dumps(recurrent_artifact[3])}",
              f"soft_penalty_weight = {json.dumps(recurrent_artifact[4])}",
              "",
              "[registration]",
              f"search_radius_px = {json.dumps(registration[0])}",
              f"search_step_px = {json.dumps(registration[1])}",
              "",
              "[phase_refinement]",
              f"iterations = {json.dumps(phase_refinement[0])}",
              f"min_score = {json.dumps(phase_refinement[1])}",
              f"max_abs_correction_px = {json.dumps(phase_refinement[2])}",
              f"smoothing_window_frames = {json.dumps(phase_refinement[3])}",
              "",
              "[auto_velocity]",
              'search_radius_px = "90"',
              "",
              "[progress]",
              'interval_frames = "25"',
              'partial_output_interval_frames = "250"',
              "",
              "[debug]",
              'residual_preview_frames = "3"',
              f"residual_preview_interval_frames = {json.dumps(env('DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES'))}",
          ]

          config = Path("beltmap-run.toml")
          config.write_text("\n".join(lines) + "\n", encoding="utf-8")
          Path("outputs/comparison_variant.json").write_text(
              json.dumps(
                  {
                      "variant": env("VARIANT"),
                      "params": params,
                      "inputs": {
                          "max_frames": env("MAX_FRAMES"),
                          "frame_stride": env("FRAME_STRIDE"),
                          "belt_region": env("BELT_REGION"),
                          "belt_velocity_px_per_frame": env("BELT_VELOCITY_PX_PER_FRAME"),
                          "belt_period_px": env("BELT_PERIOD_PX"),
                          "detection_threshold": env("DETECTION_THRESHOLD"),
                          "min_area_px": env("MIN_AREA_PX"),
                          "min_track_length": env("MIN_TRACK_LENGTH"),
                          "map_sample_frames": env("MAP_SAMPLE_FRAMES"),
                          "debug_residual_preview_interval_frames": env("DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES"),
                      },
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          print(f"Variant: {env('VARIANT')}")
          print(config.read_text(encoding="utf-8"))
          PY

      - name: Run BeltMap variant
        run: |
          poetry run beltmap-apply --config beltmap-run.toml --print-config

      - name: Generate validation report and visual QC
        if: always()
        run: |
          poetry run beltmap-validate --output-dir outputs

      - name: Preserve generated config
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          cp beltmap-run.toml outputs/beltmap-run-${VARIANT}.toml || true

      - name: Upload BeltMap comparison outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beltmap-brick-compare-${{ matrix.variant }}
          path: outputs/**
          if-no-files-found: warn
          retention-days: 14
