name: Smoke test BeltMap image driver

on:
  push:
    paths:
      - "beltmap/**"
      - "scripts/apply_beltmap_to_images.py"
      - "examples/synthetic_sequence/**"
      - ".github/workflows/smoke-beltmap-driver.yml"
      - "pyproject.toml"
      - "poetry.lock"
  pull_request:
    paths:
      - "beltmap/**"
      - "scripts/apply_beltmap_to_images.py"
      - "examples/synthetic_sequence/**"
      - ".github/workflows/smoke-beltmap-driver.yml"
      - "pyproject.toml"
      - "poetry.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_NO_INTERACTION: "1"
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  smoke-driver:
    name: Run driver on synthetic image sequence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
          .poetry-bootstrap/bin/poetry --version

      - name: Install BeltMap and test dependencies
        run: poetry install --extras test

      - name: Generate synthetic belt sequence
        run: |
          mkdir -p data/images outputs
          poetry run python examples/synthetic_sequence/generate.py \
            --output-dir data/images \
            --frames 12

      - name: Run image driver through reusable example config
        run: poetry run beltmap-apply --config examples/synthetic_sequence/beltmap.toml --print-config

      - name: Generate validation report
        run: poetry run beltmap-validate --output-dir outputs --quiet

      - name: Generate ground-truth benchmark report
        run: |
          poetry run beltmap-benchmark \
            --output-dir outputs \
            --truth-path data/images/synthetic_metadata.json \
            --quiet

      - name: Validate expected outputs
        run: |
          poetry run python examples/synthetic_sequence/validate_outputs.py \
            --output-dir outputs \
            --expected-frames 12 \
            --expected-velocity 2.0 \
            --require-validation-report
          test -s outputs/benchmark_metrics.json
          test -s outputs/benchmark_report.md

      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beltmap-driver-smoke-outputs
          path: outputs/**
          if-no-files-found: warn
          retention-days: 7
