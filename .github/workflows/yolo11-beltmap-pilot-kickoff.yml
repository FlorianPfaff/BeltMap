name: YOLO11 BeltMap pilot kickoff

run-name: YOLO11 BeltMap pilot kickoff ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/yolo11-beltmap-pilot-kickoff.yml"
      - ".github/triggers/yolo11-beltmap-pilot-kickoff.txt"
      - ".github/workflows/yolo11-beltmap-pilot.yml"
      - "beltmap/yolo_export.py"
      - "beltmap/cli/yolo_export.py"
      - "tests/test_yolo_export.py"

permissions:
  contents: read
  actions: write

concurrency:
  group: yolo11-beltmap-pilot-kickoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch-yolo11-beltmap-pilot:
    name: Dispatch YOLO11 BeltMap pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Dispatch raw YOLO11 pilot with exported BeltMap comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run yolo11-beltmap-pilot.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f dataset_name=images_BrickandSandLimeBrick_50vs50_20gpers \
            -f zenodo_record_id=7801882 \
            -f record_file_glob='images_*.zip' \
            -f truth_path=data/labels/brick20g_adversarial_labels.json \
            -f belt_region=0,220,1330,1800 \
            -f max_frames=500 \
            -f split_modulus=5 \
            -f yolo_model=yolo11n.pt \
            -f epochs=50 \
            -f imgsz=960 \
            -f batch=4 \
            -f include_residual=false \
            -f compare_bootstrap_samples=0 \
            -f compare_bootstrap_block_length_frames=5 \
            -f smoke_only=false
          echo "Dispatched yolo11-beltmap-pilot.yml on $GITHUB_REF_NAME"
