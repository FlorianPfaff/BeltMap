name: Apply BeltMap to Brick 10g/s Zenodo images

run-name: >-
  Brick 10g/s max_frames=${{ inputs.max_frames || '0' }}
  stride=${{ inputs.frame_stride || '1' }}
  velocity=${{ inputs.belt_velocity_px_per_frame || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      dataset_url:
        description: "Zenodo image zip URL"
        required: true
        type: string
        default: "https://zenodo.org/records/7802579/files/images_Brick_10gpers.zip?download=1"
      belt_region:
        description: "Crop: top,left,height,width. Default is the known Brick belt ROI."
        required: false
        type: string
        default: "0,220,1330,1800"
      belt_velocity_px_per_frame:
        description: "Belt image velocity in px/frame, or 'auto'"
        required: true
        type: string
        default: "59.3"
      belt_period_px:
        description: "Optional belt period/circumference in pixels. Empty = infer sequence map."
        required: false
        type: string
        default: "14723"
      detection_threshold:
        description: "Threshold on normalized residual for bright brick particles"
        required: true
        type: string
        default: "5.0"
      min_area_px:
        description: "Minimum connected-component particle area"
        required: true
        type: string
        default: "4"
      min_track_length:
        description: "Minimum detections per track for velocity output"
        required: true
        type: string
        default: "2"
      max_match_distance_px:
        description: "Optional tracking max distance. Empty = auto from belt speed."
        required: false
        type: string
        default: ""
      max_frames:
        description: "Optional limit on processed frames. 0 = all selected frames."
        required: true
        type: string
        default: "0"
      frame_stride:
        description: "Process every Nth frame after natural sorting. 1 = no subsampling."
        required: true
        type: string
        default: "1"
      map_sample_frames:
        description: "Number of frames sampled to build the belt map"
        required: true
        type: string
        default: "120"
      velocity_search_radius_px:
        description: "Max vertical shift searched for auto velocity"
        required: true
        type: string
        default: "90"
      progress_interval_frames:
        description: "Print progress every N frames during long stages"
        required: true
        type: string
        default: "25"
      partial_output_interval_frames:
        description: "Write partial CSV outputs every N processed frames. 0 = only final."
        required: true
        type: string
        default: "250"
      debug_residual_preview_frames:
        description: "Save residual PNG previews for the first N frames"
        required: true
        type: string
        default: "3"
      debug_residual_preview_interval_frames:
        description: "Also save residual previews every N frames. 0 = disabled."
        required: true
        type: string
        default: "0"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_NO_INTERACTION: "1"
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
          .poetry-bootstrap/bin/poetry --version

      - name: Validate Zenodo URL is reachable
        env:
          DATASET_URL: ${{ inputs.dataset_url }}
        run: |
          curl -L --fail --head --retry 3 --retry-delay 5 --connect-timeout 30 "$DATASET_URL"

      - name: Install and test package
        run: |
          poetry install --with test
          poetry run pytest -q

      - name: Validate driver imports and configuration parsing
        env:
          BELT_REGION: ${{ inputs.belt_region }}
          BELT_VELOCITY_PX_PER_FRAME: ${{ inputs.belt_velocity_px_per_frame }}
          BELT_PERIOD_PX: ${{ inputs.belt_period_px }}
          DETECTION_THRESHOLD: ${{ inputs.detection_threshold }}
          MIN_AREA_PX: ${{ inputs.min_area_px }}
          MIN_TRACK_LENGTH: ${{ inputs.min_track_length }}
          MAX_MATCH_DISTANCE_PX: ${{ inputs.max_match_distance_px }}
          MAX_FRAMES: ${{ inputs.max_frames }}
          FRAME_STRIDE: ${{ inputs.frame_stride }}
          MAP_SAMPLE_FRAMES: ${{ inputs.map_sample_frames }}
          VELOCITY_SEARCH_RADIUS_PX: ${{ inputs.velocity_search_radius_px }}
          PROGRESS_INTERVAL_FRAMES: ${{ inputs.progress_interval_frames }}
          PARTIAL_OUTPUT_INTERVAL_FRAMES: ${{ inputs.partial_output_interval_frames }}
          DEBUG_RESIDUAL_PREVIEW_FRAMES: ${{ inputs.debug_residual_preview_frames }}
          DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES: ${{ inputs.debug_residual_preview_interval_frames }}
        run: |
          poetry run python - <<'PY'
          import json
          import os
          import scripts.apply_beltmap_to_images as driver

          checks = {
              "data_dir": str(driver.DATA),
              "output_dir": str(driver.OUT),
              "extensions": sorted(driver.EXTS),
              "belt_velocity_px_per_frame": os.environ["BELT_VELOCITY_PX_PER_FRAME"],
              "max_frames": int(os.environ["MAX_FRAMES"]),
              "frame_stride": int(os.environ["FRAME_STRIDE"]),
              "map_sample_frames": int(os.environ["MAP_SAMPLE_FRAMES"]),
              "velocity_search_radius_px": int(os.environ["VELOCITY_SEARCH_RADIUS_PX"]),
              "progress_interval_frames": int(os.environ["PROGRESS_INTERVAL_FRAMES"]),
              "partial_output_interval_frames": int(os.environ["PARTIAL_OUTPUT_INTERVAL_FRAMES"]),
              "debug_residual_preview_frames": int(os.environ["DEBUG_RESIDUAL_PREVIEW_FRAMES"]),
              "debug_residual_preview_interval_frames": int(os.environ["DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES"]),
          }
          float(os.environ["DETECTION_THRESHOLD"])
          int(os.environ["MIN_AREA_PX"])
          int(os.environ["MIN_TRACK_LENGTH"])
          if os.environ.get("BELT_PERIOD_PX", "").strip():
              int(os.environ["BELT_PERIOD_PX"])
          if os.environ.get("MAX_MATCH_DISTANCE_PX", "").strip():
              float(os.environ["MAX_MATCH_DISTANCE_PX"])
          if os.environ.get("BELT_REGION", "").strip():
              region = [int(part.strip()) for part in os.environ["BELT_REGION"].split(",")]
              assert len(region) == 4, region
              checks["belt_region"] = region
          print(json.dumps(checks, indent=2))
          PY

  apply-beltmap:
    name: Apply BeltMap
    needs: preflight
    runs-on: [self-hosted, linux]
    timeout-minutes: 360

    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
          .poetry-bootstrap/bin/poetry --version

      - name: Install BeltMap and runtime dependencies
        run: |
          poetry install --with test
          poetry run pytest -q

      - name: Prepare Zenodo dataset from local runner cache
        env:
          DATASET_URL: ${{ inputs.dataset_url }}
        run: |
          set -euo pipefail

          CACHE_ROOT="$HOME/.cache/beltmap/brick-10gpers"
          CACHE_ZIP="$CACHE_ROOT/images_Brick_10gpers.zip"
          CACHE_IMAGES="$CACHE_ROOT/images"

          mkdir -p "$CACHE_ROOT" data outputs

          if [ ! -s "$CACHE_ZIP" ]; then
            echo "Local dataset zip cache miss; downloading Zenodo zip."
            rm -f "$CACHE_ZIP.tmp"
            curl -L --fail --retry 5 --retry-delay 10 --connect-timeout 30 \
              -o "$CACHE_ZIP.tmp" "$DATASET_URL"
            mv "$CACHE_ZIP.tmp" "$CACHE_ZIP"
          else
            echo "Local dataset zip cache hit: $CACHE_ZIP"
          fi

          if ! find "$CACHE_IMAGES" -type f 2>/dev/null | grep -q .; then
            echo "Local extracted dataset cache miss; extracting images."
            rm -rf "$CACHE_IMAGES"
            mkdir -p "$CACHE_IMAGES"
            poetry run python -c 'from zipfile import ZipFile; ZipFile("'$CACHE_ZIP'").extractall("'$CACHE_IMAGES'")'
          else
            echo "Local extracted dataset cache hit: $CACHE_IMAGES"
          fi

          rm -rf data/images data/images_Brick_10gpers.zip
          ln -s "$CACHE_ZIP" data/images_Brick_10gpers.zip
          ln -s "$CACHE_IMAGES" data/images

          echo "Dataset size summary:"
          du -sh data/images_Brick_10gpers.zip data/images || true
          echo "Number of extracted image files:"
          find data/images -type f | wc -l
          echo "First files in extracted dataset:"
          find data/images -type f | sed -n '1,20p'

      - name: Run BeltMap driver
        env:
          BELT_REGION: ${{ inputs.belt_region }}
          BELT_VELOCITY_PX_PER_FRAME: ${{ inputs.belt_velocity_px_per_frame }}
          BELT_PERIOD_PX: ${{ inputs.belt_period_px }}
          DETECTION_THRESHOLD: ${{ inputs.detection_threshold }}
          MIN_AREA_PX: ${{ inputs.min_area_px }}
          MIN_TRACK_LENGTH: ${{ inputs.min_track_length }}
          MAX_MATCH_DISTANCE_PX: ${{ inputs.max_match_distance_px }}
          MAX_FRAMES: ${{ inputs.max_frames }}
          FRAME_STRIDE: ${{ inputs.frame_stride }}
          MAP_SAMPLE_FRAMES: ${{ inputs.map_sample_frames }}
          VELOCITY_SEARCH_RADIUS_PX: ${{ inputs.velocity_search_radius_px }}
          PROGRESS_INTERVAL_FRAMES: ${{ inputs.progress_interval_frames }}
          PARTIAL_OUTPUT_INTERVAL_FRAMES: ${{ inputs.partial_output_interval_frames }}
          DEBUG_RESIDUAL_PREVIEW_FRAMES: ${{ inputs.debug_residual_preview_frames }}
          DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES: ${{ inputs.debug_residual_preview_interval_frames }}
        run: poetry run python -u scripts/apply_beltmap_to_images.py

      - name: Upload BeltMap outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beltmap-brick-10gpers-results
          path: outputs/**
          if-no-files-found: warn
          retention-days: 14
