name: Apply BeltMap to Brick 10g/s Zenodo images

run-name: >-
  Brick 10g/s implementation=scikit-image
  max_frames=${{ inputs.max_frames || '0' }}
  stride=${{ inputs.frame_stride || '1' }}
  velocity=${{ inputs.belt_velocity_px_per_frame || 'auto' }}
  phase_refinement=${{ inputs.phase_refinement_iterations || '0' }}

on:
  workflow_dispatch:
    inputs:
      publish_to_paper_repo:
        description: "Dispatch paper-repo build-results workflow to fetch this raw artifact"
        required: true
        type: boolean
        default: false
      belt_region:
        description: "Crop: top,left,height,width. Default is the known Brick belt ROI."
        required: false
        type: string
        default: "0,220,1330,1800"
      belt_velocity_px_per_frame:
        description: "Belt image velocity in px/frame, or 'auto'"
        required: true
        type: string
        default: "59.3"
      belt_period_px:
        description: "Optional belt period/circumference in pixels. Empty = infer sequence map."
        required: false
        type: string
        default: "14723"
      detection_threshold:
        description: "Threshold on normalized residual for bright brick particles"
        required: true
        type: string
        default: "4.5"
      min_area_px:
        description: "Minimum connected-component particle area"
        required: true
        type: string
        default: "4"
      detection_shape_gates:
        description: "Detection gates as max_area,min_width,min_height,max_aspect,min_extent. 0 disables a gate."
        required: true
        type: string
        default: "0,3,3,4.0,0.15"
      min_track_length:
        description: "Minimum detections per track for velocity output"
        required: true
        type: string
        default: "3"
      max_frames:
        description: "Optional limit on processed frames. 0 = all selected frames."
        required: true
        type: string
        default: "0"
      frame_stride:
        description: "Process every Nth frame after natural sorting. 1 = no subsampling."
        required: true
        type: string
        default: "1"
      map_sample_frames:
        description: "Number of frames sampled to build the belt map"
        required: true
        type: string
        default: "500"
      map_mask_iterations:
        description: "Particle-mask refinement iterations while building the belt map"
        required: true
        type: string
        default: "2"
      map_particle_mask_mode:
        description: "Map-building mask mode: positive, absolute, or hysteresis_abs"
        required: true
        type: choice
        options:
          - positive
          - absolute
          - hysteresis_abs
        default: "hysteresis_abs"
      map_particle_mask_threshold:
        description: "Strong threshold on provisional map residuals for masking particle pixels"
        required: true
        type: string
        default: "4.0"
      map_particle_mask_grow_threshold:
        description: "Lower absolute-residual threshold used to grow hysteresis map masks"
        required: true
        type: string
        default: "1.5"
      map_particle_mask_dilation_px:
        description: "Morphological dilation radius for map-building particle masks"
        required: true
        type: string
        default: "8"
      map_particle_mask_margin_px:
        description: "Safety margin around detected particle boxes during map building"
        required: true
        type: string
        default: "16"
      map_aggregation_options:
        description: "Map aggregation as method,robust_iterations,huber_delta,min_scale"
        required: true
        type: string
        default: "huber,1,3.0,1.0"
      static_noise_options:
        description: "Static options as noise_sample,min_scale,noise_mask_threshold,noise_mask_margin,noise_min_area[,background_sample,background_mask_threshold,background_mask_margin,background_min_area]."
        required: true
        type: string
        default: "0,0,4.0,16,4,500,4.0,16,4"
      recurrent_artifact_options:
        description: "Recurrent artifact options as min_revolutions,margin,max_overlap[,mode,soft_penalty[,candidate_max_area,candidate_max_peak[,reject_max_area,reject_max_peak[,reuse_map_path]]]]. 0,2,0.3 disables."
        required: true
        type: string
        default: "3,2,0.3,soft,0.5,8,10,8,10"
      registration_search:
        description: "Local phase-registration search as radius,step in pixels"
        required: true
        type: string
        default: "12.0,0.5"
      phase_refinement_iterations:
        description: "Phase-feedback map-refinement iterations. 0 = disabled."
        required: true
        type: string
        default: "1"
      phase_refinement_min_score:
        description: "Minimum registration score accepted for phase-feedback refinement"
        required: true
        type: string
        default: "0.0"
      phase_refinement_max_abs_correction_px:
        description: "Maximum absolute phase correction accepted for phase-feedback refinement. 0 = disabled."
        required: true
        type: string
        default: "4"
      phase_refinement_smoothing_window_frames:
        description: "Rolling-median smoothing window for accepted phase corrections"
        required: true
        type: string
        default: "25"
      progress_intervals:
        description: "Intervals as progress,partial,debug-preview. Partial/debug 0 = disabled."
        required: true
        type: string
        default: "25,250,0"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_NO_INTERACTION: "1"
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
          .poetry-bootstrap/bin/poetry --version

      - name: Validate Zenodo URL is reachable
        env:
          DATASET_URL: "https://zenodo.org/records/7802579/files/images_Brick_10gpers.zip?download=1"
        run: |
          curl -L --fail --head --retry 3 --retry-delay 5 --connect-timeout 30 "$DATASET_URL"

      - name: Install and test package
        env:
          BELTMAP_IMPLEMENTATION: scikit-image
        run: |
          rm -rf .venv
          case "$BELTMAP_IMPLEMENTATION" in
            scikit-image)
              poetry install --with test --extras speed
              ;;
            numpy)
              poetry install --with test
              ;;
            *)
              echo "Unsupported implementation: $BELTMAP_IMPLEMENTATION" >&2
              exit 64
              ;;
          esac
          poetry run python - <<'PY'
          import importlib.util
          import os

          import numpy as np

          implementation = os.environ["BELTMAP_IMPLEMENTATION"]
          skimage_spec = importlib.util.find_spec("skimage")
          print(f"selected implementation: {implementation}")
          print(f"numpy {np.__version__}")
          if skimage_spec is None:
              print("scikit-image not installed")
          else:
              import skimage

              print(f"scikit-image {skimage.__version__}")
          if implementation == "scikit-image" and skimage_spec is None:
              raise SystemExit("scikit-image implementation selected, but scikit-image is not installed")
          if implementation == "numpy" and skimage_spec is not None:
              raise SystemExit("numpy implementation selected, but scikit-image is unexpectedly installed")
          PY
          poetry run pytest -q

      - name: Validate driver imports and configuration parsing
        env:
          BELT_REGION: ${{ inputs.belt_region }}
          BELT_VELOCITY_PX_PER_FRAME: ${{ inputs.belt_velocity_px_per_frame }}
          BELT_PERIOD_PX: ${{ inputs.belt_period_px }}
          DETECTION_THRESHOLD: ${{ inputs.detection_threshold }}
          MIN_AREA_PX: ${{ inputs.min_area_px }}
          DETECTION_SHAPE_GATES: ${{ inputs.detection_shape_gates }}
          MIN_TRACK_LENGTH: ${{ inputs.min_track_length }}
          MAX_MATCH_DISTANCE_PX: ""
          MAX_FRAMES: ${{ inputs.max_frames }}
          FRAME_STRIDE: ${{ inputs.frame_stride }}
          MAP_SAMPLE_FRAMES: ${{ inputs.map_sample_frames }}
          MAP_MASK_ITERATIONS: ${{ inputs.map_mask_iterations }}
          MAP_PARTICLE_MASK_MODE: ${{ inputs.map_particle_mask_mode }}
          MAP_PARTICLE_MASK_THRESHOLD: ${{ inputs.map_particle_mask_threshold }}
          MAP_PARTICLE_MASK_GROW_THRESHOLD: ${{ inputs.map_particle_mask_grow_threshold }}
          MAP_PARTICLE_MASK_DILATION_PX: ${{ inputs.map_particle_mask_dilation_px }}
          MAP_PARTICLE_MASK_MARGIN_PX: ${{ inputs.map_particle_mask_margin_px }}
          MAP_PARTICLE_MASK_MIN_AREA_PX: "8"
          MAP_AGGREGATION_OPTIONS: ${{ inputs.map_aggregation_options }}
          STATIC_NOISE_OPTIONS: ${{ inputs.static_noise_options }}
          RECURRENT_ARTIFACT_OPTIONS: ${{ inputs.recurrent_artifact_options }}
          REGISTRATION_SEARCH: ${{ inputs.registration_search }}
          PHASE_REFINEMENT_ITERATIONS: ${{ inputs.phase_refinement_iterations }}
          PHASE_REFINEMENT_MIN_SCORE: ${{ inputs.phase_refinement_min_score }}
          PHASE_REFINEMENT_MAX_ABS_CORRECTION_PX: ${{ inputs.phase_refinement_max_abs_correction_px }}
          PHASE_REFINEMENT_SMOOTHING_WINDOW_FRAMES: ${{ inputs.phase_refinement_smoothing_window_frames }}
          VELOCITY_SEARCH_RADIUS_PX: "90"
          PROGRESS_INTERVALS: ${{ inputs.progress_intervals }}
          DEBUG_RESIDUAL_PREVIEW_FRAMES: "3"
        run: |
          poetry run python - <<'PY'
          import json
          import os

          import beltmap.driver as driver

          def parse_csv_values(name, count):
              values = [part.strip() for part in os.environ[name].split(",")]
              if len(values) != count:
                  raise SystemExit(f"{name} must contain {count} comma-separated values")
              return values

          def parse_progress_intervals():
              values = [part.strip() for part in os.environ["PROGRESS_INTERVALS"].split(",")]
              if len(values) == 2:
                  values.append("0")
              elif len(values) != 3:
                  raise SystemExit(
                      "PROGRESS_INTERVALS must contain progress,partial[,debug_preview]"
                  )
              return values

          def parse_static_options():
              values = [part.strip() for part in os.environ["STATIC_NOISE_OPTIONS"].split(",")]
              if len(values) == 5:
                  return values, ["0", "0", "8", values[4]]
              if len(values) == 9:
                  return values[:5], values[5:]
              raise SystemExit(
                  "STATIC_NOISE_OPTIONS must contain "
                  "noise_sample,min_scale,noise_mask_threshold,noise_mask_margin,noise_min_area"
                  "[,background_sample,background_mask_threshold,background_mask_margin,background_min_area]"
              )

          def parse_map_aggregation_options():
              values = [part.strip() for part in os.environ["MAP_AGGREGATION_OPTIONS"].split(",")]
              if len(values) != 4:
                  raise SystemExit(
                      "MAP_AGGREGATION_OPTIONS must contain method,robust_iterations,huber_delta,min_scale"
                  )
              values[0] = values[0].lower()
              if values[0] not in {"mean", "huber"}:
                  raise SystemExit("MAP_AGGREGATION_OPTIONS method must be mean or huber")
              if int(values[1]) < 0:
                  raise SystemExit("MAP_AGGREGATION_OPTIONS robust_iterations must be non-negative")
              if float(values[2]) <= 0:
                  raise SystemExit("MAP_AGGREGATION_OPTIONS huber_delta must be positive")
              if float(values[3]) <= 0:
                  raise SystemExit("MAP_AGGREGATION_OPTIONS min_scale must be positive")
              return values

          def parse_recurrent_artifact_options():
              values = [part.strip() for part in os.environ["RECURRENT_ARTIFACT_OPTIONS"].split(",")]
              if len(values) == 3:
                  values.extend(["hard", "1.0", "", "", "", "", ""])
              elif len(values) == 5:
                  values.extend(["", "", "", "", ""])
              elif len(values) == 6:
                  values = values[:5] + ["", "", "", "", values[5]]
              elif len(values) == 7:
                  values.extend(["", "", ""])
              elif len(values) == 8:
                  values = values[:7] + ["", "", values[7]]
              elif len(values) == 9:
                  values.append("")
              elif len(values) != 10:
                  raise SystemExit(
                      "RECURRENT_ARTIFACT_OPTIONS must contain "
                      "min_revolutions,margin,max_overlap[,mode,soft_penalty[,candidate_max_area,candidate_max_peak[,reject_max_area,reject_max_peak[,reuse_map_path]]]]"
                  )
              values[3] = values[3].lower()
              if values[3] not in {"hard", "soft", "probabilistic"}:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS mode must be hard, soft, or probabilistic")
              if float(values[4]) < 0:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS soft_penalty must be non-negative")
              if values[5] and int(values[5]) < 1:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS candidate_max_area must be positive or empty")
              if values[6] and float(values[6]) < 0:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS candidate_max_peak must be non-negative or empty")
              if values[7] and int(values[7]) < 1:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS reject_max_area must be positive or empty")
              if values[8] and float(values[8]) < 0:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS reject_max_peak must be non-negative or empty")
              return values

          static_noise, static_background = parse_static_options()
          map_aggregation = parse_map_aggregation_options()
          recurrent_artifact = parse_recurrent_artifact_options()
          registration_search = parse_csv_values("REGISTRATION_SEARCH", 2)
          progress = parse_progress_intervals()
          checks = {
              "driver": driver.__name__,
              "belt_velocity_px_per_frame": os.environ["BELT_VELOCITY_PX_PER_FRAME"],
              "max_frames": int(os.environ["MAX_FRAMES"]),
              "frame_stride": int(os.environ["FRAME_STRIDE"]),
              "map_sample_frames": int(os.environ["MAP_SAMPLE_FRAMES"]),
              "map_mask_iterations": int(os.environ["MAP_MASK_ITERATIONS"]),
              "detection_shape_gates": os.environ["DETECTION_SHAPE_GATES"],
              "map_particle_mask_mode": os.environ["MAP_PARTICLE_MASK_MODE"],
              "map_particle_mask_threshold": float(os.environ["MAP_PARTICLE_MASK_THRESHOLD"]),
              "map_particle_mask_grow_threshold": float(os.environ["MAP_PARTICLE_MASK_GROW_THRESHOLD"]),
              "map_particle_mask_dilation_px": int(os.environ["MAP_PARTICLE_MASK_DILATION_PX"]),
              "map_particle_mask_margin_px": int(os.environ["MAP_PARTICLE_MASK_MARGIN_PX"]),
              "map_particle_mask_min_area_px": int(os.environ["MAP_PARTICLE_MASK_MIN_AREA_PX"]),
              "map_aggregation": map_aggregation[0],
              "map_robust_iterations": int(map_aggregation[1]),
              "map_robust_huber_delta": float(map_aggregation[2]),
              "map_robust_min_scale": float(map_aggregation[3]),
              "static_noise_sample_frames": int(static_noise[0]),
              "static_noise_min_scale": float(static_noise[1]),
              "static_noise_mask_threshold": float(static_noise[2]),
              "static_noise_mask_margin_px": int(static_noise[3]),
              "static_noise_mask_min_area_px": int(static_noise[4]),
              "static_background_sample_frames": int(static_background[0]),
              "static_background_mask_threshold": float(static_background[1]),
              "static_background_mask_margin_px": int(static_background[2]),
              "static_background_mask_min_area_px": int(static_background[3]),
              "recurrent_artifact_min_revolutions": int(recurrent_artifact[0]),
              "recurrent_artifact_margin_px": int(recurrent_artifact[1]),
              "recurrent_artifact_max_overlap_fraction": float(recurrent_artifact[2]),
              "recurrent_artifact_mode": recurrent_artifact[3],
              "recurrent_artifact_soft_penalty_weight": float(recurrent_artifact[4]),
              "recurrent_artifact_candidate_max_area_px": recurrent_artifact[5],
              "recurrent_artifact_candidate_max_peak_signal": recurrent_artifact[6],
              "recurrent_artifact_reject_max_area_px": recurrent_artifact[7],
              "recurrent_artifact_reject_max_peak_signal": recurrent_artifact[8],
              "reuse_recurrent_artifact_map_path": recurrent_artifact[9],
              "registration_search_radius_px": float(registration_search[0]),
              "registration_search_step_px": float(registration_search[1]),
              "phase_refinement_iterations": int(os.environ["PHASE_REFINEMENT_ITERATIONS"]),
              "phase_refinement_min_score": float(os.environ["PHASE_REFINEMENT_MIN_SCORE"]),
              "phase_refinement_max_abs_correction_px": float(os.environ["PHASE_REFINEMENT_MAX_ABS_CORRECTION_PX"]),
              "phase_refinement_smoothing_window_frames": int(os.environ["PHASE_REFINEMENT_SMOOTHING_WINDOW_FRAMES"]),
              "velocity_search_radius_px": int(os.environ["VELOCITY_SEARCH_RADIUS_PX"]),
              "progress_interval_frames": int(progress[0]),
              "partial_output_interval_frames": int(progress[1]),
              "debug_residual_preview_frames": int(os.environ["DEBUG_RESIDUAL_PREVIEW_FRAMES"]),
              "debug_residual_preview_interval_frames": int(progress[2]),
          }
          float(os.environ["DETECTION_THRESHOLD"])
          int(os.environ["MIN_AREA_PX"])
          int(os.environ["MIN_TRACK_LENGTH"])
          if os.environ.get("BELT_PERIOD_PX", "").strip():
              int(os.environ["BELT_PERIOD_PX"])
          if os.environ.get("MAX_MATCH_DISTANCE_PX", "").strip():
              float(os.environ["MAX_MATCH_DISTANCE_PX"])
          if os.environ.get("BELT_REGION", "").strip():
              region = [int(part.strip()) for part in os.environ["BELT_REGION"].split(",")]
              assert len(region) == 4, region
              checks["belt_region"] = region
          print(json.dumps(checks, indent=2))
          PY

  apply-beltmap:
    name: Apply BeltMap
    needs: preflight
    runs-on: [self-hosted, Linux]
    # Keep below 24 hours while giving a safety margin over expected full phase-refined runs.
    timeout-minutes: 1320

    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
          .poetry-bootstrap/bin/poetry --version

      - name: Install BeltMap and runtime dependencies
        env:
          BELTMAP_IMPLEMENTATION: scikit-image
        run: |
          rm -rf .venv
          case "$BELTMAP_IMPLEMENTATION" in
            scikit-image)
              poetry install --with test --extras speed
              ;;
            numpy)
              poetry install --with test
              ;;
            *)
              echo "Unsupported implementation: $BELTMAP_IMPLEMENTATION" >&2
              exit 64
              ;;
          esac
          poetry run python - <<'PY'
          import importlib.util
          import os

          import numpy as np

          implementation = os.environ["BELTMAP_IMPLEMENTATION"]
          skimage_spec = importlib.util.find_spec("skimage")
          print(f"selected implementation: {implementation}")
          print(f"numpy {np.__version__}")
          if skimage_spec is None:
              print("scikit-image not installed")
          else:
              import skimage

              print(f"scikit-image {skimage.__version__}")
          if implementation == "scikit-image" and skimage_spec is None:
              raise SystemExit("scikit-image implementation selected, but scikit-image is not installed")
          if implementation == "numpy" and skimage_spec is not None:
              raise SystemExit("numpy implementation selected, but scikit-image is unexpectedly installed")
          PY
          poetry run pytest -q

      - name: Prepare Zenodo dataset from local runner dataset cache
        env:
          DATASET_URL: "https://zenodo.org/records/7802579/files/images_Brick_10gpers.zip?download=1"
        run: |
          set -euo pipefail

          DATASET_CACHE_ROOT="$HOME/.cache/datasets"
          DATASET_NAME="images_Brick_10gpers"
          CACHE_IMAGES="$DATASET_CACHE_ROOT/$DATASET_NAME"
          CACHE_ZIP="$DATASET_CACHE_ROOT/$DATASET_NAME.zip"
          CACHE_TMP="$DATASET_CACHE_ROOT/$DATASET_NAME.tmp"

          mkdir -p "$DATASET_CACHE_ROOT" data outputs

          if find "$CACHE_IMAGES" -type f 2>/dev/null | grep -q .; then
            echo "Local extracted dataset cache hit: $CACHE_IMAGES"
          else
            echo "Local extracted dataset cache miss or empty: $CACHE_IMAGES"
            rm -rf "$CACHE_TMP"
            mkdir -p "$CACHE_TMP"
            if [ ! -s "$CACHE_ZIP" ]; then
              echo "Local dataset zip cache miss; downloading Zenodo zip to $CACHE_ZIP"
              rm -f "$CACHE_ZIP.tmp"
              curl -L --fail --retry 5 --retry-delay 10 --connect-timeout 30 \
                -o "$CACHE_ZIP.tmp" "$DATASET_URL"
              mv "$CACHE_ZIP.tmp" "$CACHE_ZIP"
            else
              echo "Local dataset zip cache hit: $CACHE_ZIP"
            fi
            echo "Extracting dataset atomically to $CACHE_IMAGES"
            poetry run python -c \
              'import sys; from zipfile import ZipFile; ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
              "$CACHE_ZIP" "$CACHE_TMP"
            rm -rf "$CACHE_IMAGES"
            mv "$CACHE_TMP" "$CACHE_IMAGES"
          fi

          rm -rf data/images data/images_Brick_10gpers.zip
          ln -s "$CACHE_IMAGES" data/images
          if [ -s "$CACHE_ZIP" ]; then
            ln -s "$CACHE_ZIP" data/images_Brick_10gpers.zip
          fi

          echo "Dataset size summary:"
          du -sh "$CACHE_IMAGES" data/images data/images_Brick_10gpers.zip 2>/dev/null || true
          echo "Number of extracted image files:"
          find data/images -type f | wc -l
          echo "First files in extracted dataset:"
          find data/images -type f | sed -n '1,20p'

      - name: Run BeltMap through CLI config
        env:
          BELT_REGION: ${{ inputs.belt_region }}
          BELT_VELOCITY_PX_PER_FRAME: ${{ inputs.belt_velocity_px_per_frame }}
          BELT_PERIOD_PX: ${{ inputs.belt_period_px }}
          DETECTION_THRESHOLD: ${{ inputs.detection_threshold }}
          MIN_AREA_PX: ${{ inputs.min_area_px }}
          DETECTION_SHAPE_GATES: ${{ inputs.detection_shape_gates }}
          MIN_TRACK_LENGTH: ${{ inputs.min_track_length }}
          MAX_MATCH_DISTANCE_PX: ""
          MAX_FRAMES: ${{ inputs.max_frames }}
          FRAME_STRIDE: ${{ inputs.frame_stride }}
          MAP_SAMPLE_FRAMES: ${{ inputs.map_sample_frames }}
          MAP_MASK_ITERATIONS: ${{ inputs.map_mask_iterations }}
          MAP_PARTICLE_MASK_MODE: ${{ inputs.map_particle_mask_mode }}
          MAP_PARTICLE_MASK_THRESHOLD: ${{ inputs.map_particle_mask_threshold }}
          MAP_PARTICLE_MASK_GROW_THRESHOLD: ${{ inputs.map_particle_mask_grow_threshold }}
          MAP_PARTICLE_MASK_DILATION_PX: ${{ inputs.map_particle_mask_dilation_px }}
          MAP_PARTICLE_MASK_MARGIN_PX: ${{ inputs.map_particle_mask_margin_px }}
          MAP_PARTICLE_MASK_MIN_AREA_PX: "8"
          MAP_AGGREGATION_OPTIONS: ${{ inputs.map_aggregation_options }}
          STATIC_NOISE_OPTIONS: ${{ inputs.static_noise_options }}
          RECURRENT_ARTIFACT_OPTIONS: ${{ inputs.recurrent_artifact_options }}
          REGISTRATION_SEARCH: ${{ inputs.registration_search }}
          PHASE_REFINEMENT_ITERATIONS: ${{ inputs.phase_refinement_iterations }}
          PHASE_REFINEMENT_MIN_SCORE: ${{ inputs.phase_refinement_min_score }}
          PHASE_REFINEMENT_MAX_ABS_CORRECTION_PX: ${{ inputs.phase_refinement_max_abs_correction_px }}
          PHASE_REFINEMENT_SMOOTHING_WINDOW_FRAMES: ${{ inputs.phase_refinement_smoothing_window_frames }}
          VELOCITY_SEARCH_RADIUS_PX: "90"
          PROGRESS_INTERVALS: ${{ inputs.progress_intervals }}
          DEBUG_RESIDUAL_PREVIEW_FRAMES: "3"
        run: |
          poetry run python - <<'PY'
          import json
          import os
          from pathlib import Path

          def env_value(name: str) -> str:
              return os.environ.get(name, "").strip()

          def append_value(
              lines: list[str],
              key: str,
              env_name: str,
              *,
              optional: bool = False,
          ) -> None:
              value = env_value(env_name)
              if optional and value == "":
                  return
              lines.append(f"{key} = {json.dumps(value)}")

          def parse_detection_shape_gates() -> dict[str, str]:
              raw = env_value("DETECTION_SHAPE_GATES") or "0,0,0,0,0"
              values = [part.strip() for part in raw.split(",")]
              if len(values) != 5:
                  raise SystemExit(
                      "DETECTION_SHAPE_GATES must be max_area,min_width,min_height,"
                      "max_aspect,min_extent"
                  )
              return dict(
                  zip(
                      [
                          "max_area_px",
                          "min_bbox_width_px",
                          "min_bbox_height_px",
                          "max_bbox_aspect_ratio",
                          "min_bbox_extent",
                      ],
                      values,
                  )
              )

          def parse_csv_values(env_name: str, count: int) -> list[str]:
              values = [part.strip() for part in env_value(env_name).split(",")]
              if len(values) != count:
                  raise SystemExit(f"{env_name} must contain {count} comma-separated values")
              return values

          def parse_progress_intervals() -> list[str]:
              values = [part.strip() for part in env_value("PROGRESS_INTERVALS").split(",")]
              if len(values) == 2:
                  values.append("0")
              elif len(values) != 3:
                  raise SystemExit(
                      "PROGRESS_INTERVALS must contain progress,partial[,debug_preview]"
                  )
              return values

          def parse_static_options() -> tuple[list[str], list[str]]:
              values = [part.strip() for part in env_value("STATIC_NOISE_OPTIONS").split(",")]
              if len(values) == 5:
                  return values, ["0", "0", "8", values[4]]
              if len(values) == 9:
                  return values[:5], values[5:]
              raise SystemExit(
                  "STATIC_NOISE_OPTIONS must contain "
                  "noise_sample,min_scale,noise_mask_threshold,noise_mask_margin,noise_min_area"
                  "[,background_sample,background_mask_threshold,background_mask_margin,background_min_area]"
              )

          def parse_map_aggregation_options() -> list[str]:
              values = [part.strip() for part in env_value("MAP_AGGREGATION_OPTIONS").split(",")]
              if len(values) != 4:
                  raise SystemExit(
                      "MAP_AGGREGATION_OPTIONS must contain method,robust_iterations,huber_delta,min_scale"
                  )
              values[0] = values[0].lower()
              if values[0] not in {"mean", "huber"}:
                  raise SystemExit("MAP_AGGREGATION_OPTIONS method must be mean or huber")
              if int(values[1]) < 0:
                  raise SystemExit("MAP_AGGREGATION_OPTIONS robust_iterations must be non-negative")
              if float(values[2]) <= 0:
                  raise SystemExit("MAP_AGGREGATION_OPTIONS huber_delta must be positive")
              if float(values[3]) <= 0:
                  raise SystemExit("MAP_AGGREGATION_OPTIONS min_scale must be positive")
              return values

          def parse_recurrent_artifact_options() -> list[str]:
              values = [part.strip() for part in env_value("RECURRENT_ARTIFACT_OPTIONS").split(",")]
              if len(values) == 3:
                  values.extend(["hard", "1.0", "", "", "", "", ""])
              elif len(values) == 5:
                  values.extend(["", "", "", "", ""])
              elif len(values) == 6:
                  values = values[:5] + ["", "", "", "", values[5]]
              elif len(values) == 7:
                  values.extend(["", "", ""])
              elif len(values) == 8:
                  values = values[:7] + ["", "", values[7]]
              elif len(values) == 9:
                  values.append("")
              elif len(values) != 10:
                  raise SystemExit(
                      "RECURRENT_ARTIFACT_OPTIONS must contain "
                      "min_revolutions,margin,max_overlap[,mode,soft_penalty[,candidate_max_area,candidate_max_peak[,reject_max_area,reject_max_peak[,reuse_map_path]]]]"
                  )
              values[3] = values[3].lower()
              if values[3] not in {"hard", "soft", "probabilistic"}:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS mode must be hard, soft, or probabilistic")
              if float(values[4]) < 0:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS soft_penalty must be non-negative")
              if values[5] and int(values[5]) < 1:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS candidate_max_area must be positive or empty")
              if values[6] and float(values[6]) < 0:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS candidate_max_peak must be non-negative or empty")
              if values[7] and int(values[7]) < 1:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS reject_max_area must be positive or empty")
              if values[8] and float(values[8]) < 0:
                  raise SystemExit("RECURRENT_ARTIFACT_OPTIONS reject_max_peak must be non-negative or empty")
              return values

          lines: list[str] = []
          lines.extend(["[paths]", 'image_dir = "data/images"', 'output_dir = "outputs"', ""])

          recurrent_artifact = parse_recurrent_artifact_options()
          driver_recurrent_artifact = recurrent_artifact
          if int(recurrent_artifact[0]) > 0:
              driver_recurrent_artifact = [
                  "0",
                  recurrent_artifact[1],
                  recurrent_artifact[2],
                  recurrent_artifact[3],
                  recurrent_artifact[4],
                  recurrent_artifact[5],
                  recurrent_artifact[6],
                  recurrent_artifact[7],
                  recurrent_artifact[8],
                  "",
              ]
          if driver_recurrent_artifact[9]:
              lines.extend(
                  [
                      "[reuse]",
                      f"recurrent_artifact_map_path = {json.dumps(driver_recurrent_artifact[9])}",
                      "",
                  ]
              )

          lines.append("[frames]")
          append_value(lines, "max_frames", "MAX_FRAMES")
          append_value(lines, "stride", "FRAME_STRIDE")
          lines.append("")

          lines.append("[belt]")
          append_value(lines, "region", "BELT_REGION", optional=True)
          append_value(lines, "velocity_px_per_frame", "BELT_VELOCITY_PX_PER_FRAME")
          append_value(lines, "period_px", "BELT_PERIOD_PX", optional=True)
          lines.append("")

          lines.append("[detection]")
          append_value(lines, "threshold", "DETECTION_THRESHOLD")
          append_value(lines, "min_area_px", "MIN_AREA_PX")
          for key, value in parse_detection_shape_gates().items():
              lines.append(f"{key} = {json.dumps(value)}")
          lines.append("")

          lines.append("[tracking]")
          append_value(lines, "min_track_length", "MIN_TRACK_LENGTH")
          append_value(lines, "max_match_distance_px", "MAX_MATCH_DISTANCE_PX", optional=True)
          lines.append('max_frame_gap = "2"')
          lines.append("")

          lines.append("[map]")
          map_aggregation = parse_map_aggregation_options()
          append_value(lines, "sample_frames", "MAP_SAMPLE_FRAMES")
          lines.append('sampling_strategy = "adaptive_phase_coverage"')
          lines.append('reconstruction_trim_fraction = "0"')
          for key, value in zip(
              [
                  "aggregation",
                  "robust_iterations",
                  "robust_huber_delta",
                  "robust_min_scale",
              ],
              map_aggregation,
          ):
              lines.append(f"{key} = {json.dumps(value)}")
          append_value(lines, "mask_iterations", "MAP_MASK_ITERATIONS")
          append_value(lines, "particle_mask_mode", "MAP_PARTICLE_MASK_MODE")
          append_value(lines, "particle_mask_threshold", "MAP_PARTICLE_MASK_THRESHOLD")
          append_value(lines, "particle_mask_grow_threshold", "MAP_PARTICLE_MASK_GROW_THRESHOLD")
          append_value(lines, "particle_mask_dilation_px", "MAP_PARTICLE_MASK_DILATION_PX")
          append_value(lines, "particle_mask_margin_px", "MAP_PARTICLE_MASK_MARGIN_PX")
          append_value(lines, "particle_mask_min_area_px", "MAP_PARTICLE_MASK_MIN_AREA_PX")
          lines.append("")

          lines.append("[static_noise]")
          static_noise, static_background = parse_static_options()
          for key, value in zip(
              [
                  "sample_frames",
                  "min_scale",
                  "mask_threshold",
                  "mask_margin_px",
                  "mask_min_area_px",
              ],
              static_noise,
          ):
              lines.append(f"{key} = {json.dumps(value)}")
          lines.append("")

          lines.append("[static_background]")
          for key, value in zip(
              [
                  "sample_frames",
                  "mask_threshold",
                  "mask_margin_px",
                  "mask_min_area_px",
              ],
              static_background,
          ):
              lines.append(f"{key} = {json.dumps(value)}")
          lines.append("")

          lines.append("[photometric]")
          lines.append('enabled = "false"')
          lines.append('trim_fraction = "0.05"')
          lines.append('max_iterations = "3"')
          lines.append('min_pixels = "10000"')
          lines.append("")

          lines.append("[recurrent_artifact]")
          for key, value in zip(
              [
                  "min_revolutions",
                  "margin_px",
                  "max_overlap_fraction",
                  "mode",
                  "soft_penalty_weight",
                  "candidate_max_area_px",
                  "candidate_max_peak_signal",
                  "reject_max_area_px",
                  "reject_max_peak_signal",
              ],
              driver_recurrent_artifact,
          ):
              if value != "":
                  lines.append(f"{key} = {json.dumps(value)}")
          lines.append("")

          lines.append("[registration]")
          registration_search = parse_csv_values("REGISTRATION_SEARCH", 2)
          lines.append(f"search_radius_px = {json.dumps(registration_search[0])}")
          lines.append(f"search_step_px = {json.dumps(registration_search[1])}")
          lines.append("")

          lines.append("[phase_refinement]")
          append_value(lines, "iterations", "PHASE_REFINEMENT_ITERATIONS")
          append_value(lines, "min_score", "PHASE_REFINEMENT_MIN_SCORE")
          append_value(lines, "max_abs_correction_px", "PHASE_REFINEMENT_MAX_ABS_CORRECTION_PX")
          append_value(lines, "smoothing_window_frames", "PHASE_REFINEMENT_SMOOTHING_WINDOW_FRAMES")
          lines.append("")

          lines.append("[auto_velocity]")
          append_value(lines, "search_radius_px", "VELOCITY_SEARCH_RADIUS_PX")
          lines.append("")

          lines.append("[progress]")
          progress_intervals = parse_progress_intervals()
          lines.append(f"interval_frames = {json.dumps(progress_intervals[0])}")
          lines.append(f"partial_output_interval_frames = {json.dumps(progress_intervals[1])}")
          lines.append("")

          lines.append("[debug]")
          append_value(lines, "residual_preview_frames", "DEBUG_RESIDUAL_PREVIEW_FRAMES")
          lines.append(f"residual_preview_interval_frames = {json.dumps(progress_intervals[2])}")

          config_path = Path("beltmap-run.toml")
          config_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(config_path.read_text(encoding="utf-8"))
          PY

          poetry run beltmap-apply --config beltmap-run.toml --print-config

      - name: Apply track-protected recurrent post-filter
        env:
          RECURRENT_ARTIFACT_OPTIONS: ${{ inputs.recurrent_artifact_options }}
        run: |
          poetry run python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          def parse_recurrent_artifact_options() -> list[str]:
              values = [part.strip() for part in os.environ["RECURRENT_ARTIFACT_OPTIONS"].split(",")]
              if len(values) == 3:
                  values.extend(["hard", "1.0", "", "", "", "", ""])
              elif len(values) == 5:
                  values.extend(["", "", "", "", ""])
              elif len(values) == 6:
                  values = values[:5] + ["", "", "", "", values[5]]
              elif len(values) == 7:
                  values.extend(["", "", ""])
              elif len(values) == 8:
                  values = values[:7] + ["", "", values[7]]
              elif len(values) == 9:
                  values.append("")
              elif len(values) != 10:
                  raise SystemExit(
                      "RECURRENT_ARTIFACT_OPTIONS must contain "
                      "min_revolutions,margin,max_overlap[,mode,soft_penalty[,candidate_max_area,candidate_max_peak[,reject_max_area,reject_max_peak[,reuse_map_path]]]]"
                  )
              return values

          recurrent_artifact = parse_recurrent_artifact_options()
          if int(recurrent_artifact[0]) < 1:
              print("Track-protected recurrent post-filter disabled by min_revolutions < 1")
              raise SystemExit(0)

          source = Path("outputs-unprotected-source")
          output = Path("outputs")
          if source.exists():
              shutil.rmtree(source)
          output.rename(source)

          cmd = [
              sys.executable,
              "-m",
              "beltmap.cli.filter_recurrent_artifacts",
              "--input-dir",
              str(source),
              "--output-dir",
              str(output),
              "--min-revolutions",
              recurrent_artifact[0],
              "--margin-px",
              recurrent_artifact[1],
              "--max-overlap-fraction",
              recurrent_artifact[2],
              "--mode",
              recurrent_artifact[3],
              "--soft-penalty-weight",
              recurrent_artifact[4],
              "--protect-source-filtered-tracks",
              "--quiet",
          ]
          optional_args = [
              ("--candidate-max-area-px", recurrent_artifact[5]),
              ("--candidate-max-peak-signal", recurrent_artifact[6]),
              ("--reject-max-area-px", recurrent_artifact[7]),
              ("--reject-max-peak-signal", recurrent_artifact[8]),
          ]
          for flag, value in optional_args:
              if value:
                  cmd.extend([flag, value])
          print("Running", " ".join(cmd))
          subprocess.run(cmd, check=True)
          PY

      - name: Generate validation report and visual QC
        run: |
          poetry run beltmap-validate --output-dir outputs

      - name: Upload BeltMap outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beltmap-brick-10gpers-scikit-image-results
          path: |
            outputs/**
            outputs-unprotected-source/**
          if-no-files-found: warn
          retention-days: 14

  dispatch-paper-results:
    name: Dispatch paper repository build
    needs: apply-beltmap
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_paper_repo == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch paper repository build-results workflow
        env:
          PAPER_REPO_TOKEN: ${{ secrets.PAPER_REPO_TOKEN }}
          PAPER_REPO: FlorianPfaff/BeltMap-Paper
          SOURCE_REPO: IPS-Stuttgart/BeltMap
          SOURCE_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: beltmap-brick-10gpers-scikit-image-results
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PAPER_REPO_TOKEN:-}" ]; then
            echo "::warning::publish_to_paper_repo=true but PAPER_REPO_TOKEN is not configured; skipping paper workflow dispatch"
            exit 0
          fi
          payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "source_repo": os.environ["SOURCE_REPO"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "artifact_name": os.environ["ARTIFACT_NAME"],
              },
          }))
          PY
          )

          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${PAPER_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PAPER_REPO}/actions/workflows/build-results.yml/dispatches" \
            -d "$payload"
