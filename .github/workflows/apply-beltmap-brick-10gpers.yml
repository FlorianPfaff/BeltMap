name: Apply BeltMap to Brick 10g/s Zenodo images

run-name: >-
  Brick 10g/s implementation=${{ inputs.implementation || 'scikit-image' }}
  max_frames=${{ inputs.max_frames || '0' }}
  stride=${{ inputs.frame_stride || '1' }}
  velocity=${{ inputs.belt_velocity_px_per_frame || 'auto' }}
  phase_refinement=${{ inputs.phase_refinement_iterations || '0' }}

on:
  workflow_dispatch:
    inputs:
      dataset_url:
        description: "Zenodo image zip URL"
        required: true
        type: string
        default: "https://zenodo.org/records/7802579/files/images_Brick_10gpers.zip?download=1"
      belt_region:
        description: "Crop: top,left,height,width. Default is the known Brick belt ROI."
        required: false
        type: string
        default: "0,220,1330,1800"
      belt_velocity_px_per_frame:
        description: "Belt image velocity in px/frame, or 'auto'"
        required: true
        type: string
        default: "59.3"
      belt_period_px:
        description: "Optional belt period/circumference in pixels. Empty = infer sequence map."
        required: false
        type: string
        default: "14723"
      implementation:
        description: "Implementation/dependency set: NumPy-only fallback or scikit-image accelerated path."
        required: true
        type: choice
        options:
          - numpy
          - scikit-image
        default: "scikit-image"
      detection_threshold:
        description: "Threshold on normalized residual for bright brick particles"
        required: true
        type: string
        default: "5.0"
      min_area_px:
        description: "Minimum connected-component particle area"
        required: true
        type: string
        default: "4"
      min_track_length:
        description: "Minimum detections per track for velocity output"
        required: true
        type: string
        default: "2"
      max_match_distance_px:
        description: "Optional tracking max distance. Empty = auto from belt speed."
        required: false
        type: string
        default: ""
      max_frames:
        description: "Optional limit on processed frames. 0 = all selected frames."
        required: true
        type: string
        default: "0"
      frame_stride:
        description: "Process every Nth frame after natural sorting. 1 = no subsampling."
        required: true
        type: string
        default: "1"
      map_sample_frames:
        description: "Number of frames sampled to build the belt map"
        required: true
        type: string
        default: "120"
      map_mask_iterations:
        description: "Particle-mask refinement iterations while building the belt map"
        required: true
        type: string
        default: "2"
      map_particle_mask_mode:
        description: "Map-building mask mode: positive, absolute, or hysteresis_abs"
        required: true
        type: choice
        options:
          - positive
          - absolute
          - hysteresis_abs
        default: "hysteresis_abs"
      map_particle_mask_threshold:
        description: "Strong threshold on provisional map residuals for masking particle pixels"
        required: true
        type: string
        default: "4.0"
      map_particle_mask_grow_threshold:
        description: "Lower abs-residual threshold used to grow hysteresis masks"
        required: true
        type: string
        default: "1.5"
      map_particle_mask_dilation_px:
        description: "Morphological dilation radius for grown map-building masks"
        required: true
        type: string
        default: "24"
      map_particle_mask_margin_px:
        description: "Safety margin added around detected/grown particle masks during map building"
        required: true
        type: string
        default: "16"
      map_particle_mask_min_area_px:
        description: "Minimum component area for map-building particle masks"
        required: true
        type: string
        default: "8"
      registration_search_radius_px:
        description: "Local phase-registration search radius around the motion-model prediction"
        required: true
        type: string
        default: "8.0"
      registration_search_step_px:
        description: "Local phase-registration search step in pixels"
        required: true
        type: string
        default: "0.5"
      phase_refinement_iterations:
        description: "Phase-feedback map-refinement iterations. 0 = disabled."
        required: true
        type: string
        default: "0"
      phase_refinement_min_score:
        description: "Minimum registration score accepted for phase-feedback refinement"
        required: true
        type: string
        default: "0.0"
      phase_refinement_max_abs_correction_px:
        description: "Maximum absolute phase correction accepted for phase-feedback refinement. 0 = disabled."
        required: true
        type: string
        default: "0"
      phase_refinement_smoothing_window_frames:
        description: "Rolling-median smoothing window for accepted phase corrections"
        required: true
        type: string
        default: "25"
      velocity_search_radius_px:
        description: "Max vertical shift searched for auto velocity"
        required: true
        type: string
        default: "90"
      progress_interval_frames:
        description: "Print progress every N frames during long stages"
        required: true
        type: string
        default: "25"
      partial_output_interval_frames:
        description: "Write partial CSV outputs every N processed frames. 0 = only final."
        required: true
        type: string
        default: "250"
      debug_residual_preview_frames:
        description: "Save residual PNG previews for the first N frames"
        required: true
        type: string
        default: "3"
      debug_residual_preview_interval_frames:
        description: "Also save residual previews every N frames. 0 = disabled."
        required: true
        type: string
        default: "0"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_NO_INTERACTION: "1"
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
          .poetry-bootstrap/bin/poetry --version

      - name: Validate Zenodo URL is reachable
        env:
          DATASET_URL: ${{ inputs.dataset_url }}
        run: |
          curl -L --fail --head --retry 3 --retry-delay 5 --connect-timeout 30 "$DATASET_URL"

      - name: Install and test package
        env:
          BELTMAP_IMPLEMENTATION: ${{ inputs.implementation }}
        run: |
          rm -rf .venv
          case "$BELTMAP_IMPLEMENTATION" in
            scikit-image)
              poetry install --with test --extras speed
              ;;
            numpy)
              poetry install --with test
              ;;
            *)
              echo "Unsupported implementation: $BELTMAP_IMPLEMENTATION" >&2
              exit 64
              ;;
          esac
          poetry run python - <<'PY'
          import importlib.util
          import os

          import numpy as np

          implementation = os.environ["BELTMAP_IMPLEMENTATION"]
          skimage_spec = importlib.util.find_spec("skimage")
          print(f"selected implementation: {implementation}")
          print(f"numpy {np.__version__}")
          if skimage_spec is None:
              print("scikit-image not installed")
          else:
              import skimage

              print(f"scikit-image {skimage.__version__}")
          if implementation == "scikit-image" and skimage_spec is None:
              raise SystemExit("scikit-image implementation selected, but scikit-image is not installed")
          if implementation == "numpy" and skimage_spec is not None:
              raise SystemExit("numpy implementation selected, but scikit-image is unexpectedly installed")
          PY
          poetry run pytest -q

      - name: Validate driver imports and configuration parsing
        env:
          BELT_REGION: ${{ inputs.belt_region }}
          BELT_VELOCITY_PX_PER_FRAME: ${{ inputs.belt_velocity_px_per_frame }}
          BELT_PERIOD_PX: ${{ inputs.belt_period_px }}
          DETECTION_THRESHOLD: ${{ inputs.detection_threshold }}
          MIN_AREA_PX: ${{ inputs.min_area_px }}
          MIN_TRACK_LENGTH: ${{ inputs.min_track_length }}
          MAX_MATCH_DISTANCE_PX: ${{ inputs.max_match_distance_px }}
          MAX_FRAMES: ${{ inputs.max_frames }}
          FRAME_STRIDE: ${{ inputs.frame_stride }}
          MAP_SAMPLE_FRAMES: ${{ inputs.map_sample_frames }}
          MAP_MASK_ITERATIONS: ${{ inputs.map_mask_iterations }}
          MAP_PARTICLE_MASK_MODE: ${{ inputs.map_particle_mask_mode }}
          MAP_PARTICLE_MASK_THRESHOLD: ${{ inputs.map_particle_mask_threshold }}
          MAP_PARTICLE_MASK_GROW_THRESHOLD: ${{ inputs.map_particle_mask_grow_threshold }}
          MAP_PARTICLE_MASK_DILATION_PX: ${{ inputs.map_particle_mask_dilation_px }}
          MAP_PARTICLE_MASK_MARGIN_PX: ${{ inputs.map_particle_mask_margin_px }}
          MAP_PARTICLE_MASK_MIN_AREA_PX: ${{ inputs.map_particle_mask_min_area_px }}
          REGISTRATION_SEARCH_RADIUS_PX: ${{ inputs.registration_search_radius_px }}
          REGISTRATION_SEARCH_STEP_PX: ${{ inputs.registration_search_step_px }}
          PHASE_REFINEMENT_ITERATIONS: ${{ inputs.phase_refinement_iterations }}
          PHASE_REFINEMENT_MIN_SCORE: ${{ inputs.phase_refinement_min_score }}
          PHASE_REFINEMENT_MAX_ABS_CORRECTION_PX: ${{ inputs.phase_refinement_max_abs_correction_px }}
          PHASE_REFINEMENT_SMOOTHING_WINDOW_FRAMES: ${{ inputs.phase_refinement_smoothing_window_frames }}
          VELOCITY_SEARCH_RADIUS_PX: ${{ inputs.velocity_search_radius_px }}
          PROGRESS_INTERVAL_FRAMES: ${{ inputs.progress_interval_frames }}
          PARTIAL_OUTPUT_INTERVAL_FRAMES: ${{ inputs.partial_output_interval_frames }}
          DEBUG_RESIDUAL_PREVIEW_FRAMES: ${{ inputs.debug_residual_preview_frames }}
          DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES: ${{ inputs.debug_residual_preview_interval_frames }}
        run: |
          poetry run python - <<'PY'
          import json
          import os

          import beltmap.driver as driver

          checks = {
              "driver": driver.__name__,
              "belt_velocity_px_per_frame": os.environ["BELT_VELOCITY_PX_PER_FRAME"],
              "max_frames": int(os.environ["MAX_FRAMES"]),
              "frame_stride": int(os.environ["FRAME_STRIDE"]),
              "map_sample_frames": int(os.environ["MAP_SAMPLE_FRAMES"]),
              "map_mask_iterations": int(os.environ["MAP_MASK_ITERATIONS"]),
              "map_particle_mask_mode": os.environ["MAP_PARTICLE_MASK_MODE"],
              "map_particle_mask_threshold": float(os.environ["MAP_PARTICLE_MASK_THRESHOLD"]),
              "map_particle_mask_grow_threshold": float(os.environ["MAP_PARTICLE_MASK_GROW_THRESHOLD"]),
              "map_particle_mask_dilation_px": int(os.environ["MAP_PARTICLE_MASK_DILATION_PX"]),
              "map_particle_mask_margin_px": int(os.environ["MAP_PARTICLE_MASK_MARGIN_PX"]),
              "map_particle_mask_min_area_px": int(os.environ["MAP_PARTICLE_MASK_MIN_AREA_PX"]),
              "registration_search_radius_px": float(os.environ["REGISTRATION_SEARCH_RADIUS_PX"]),
              "registration_search_step_px": float(os.environ["REGISTRATION_SEARCH_STEP_PX"]),
              "phase_refinement_iterations": int(os.environ["PHASE_REFINEMENT_ITERATIONS"]),
              "phase_refinement_min_score": float(os.environ["PHASE_REFINEMENT_MIN_SCORE"]),
              "phase_refinement_max_abs_correction_px": float(os.environ["PHASE_REFINEMENT_MAX_ABS_CORRECTION_PX"]),
              "phase_refinement_smoothing_window_frames": int(os.environ["PHASE_REFINEMENT_SMOOTHING_WINDOW_FRAMES"]),
              "velocity_search_radius_px": int(os.environ["VELOCITY_SEARCH_RADIUS_PX"]),
              "progress_interval_frames": int(os.environ["PROGRESS_INTERVAL_FRAMES"]),
              "partial_output_interval_frames": int(os.environ["PARTIAL_OUTPUT_INTERVAL_FRAMES"]),
              "debug_residual_preview_frames": int(os.environ["DEBUG_RESIDUAL_PREVIEW_FRAMES"]),
              "debug_residual_preview_interval_frames": int(os.environ["DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES"]),
          }
          float(os.environ["DETECTION_THRESHOLD"])
          int(os.environ["MIN_AREA_PX"])
          int(os.environ["MIN_TRACK_LENGTH"])
          if os.environ.get("BELT_PERIOD_PX", "").strip():
              int(os.environ["BELT_PERIOD_PX"])
          if os.environ.get("MAX_MATCH_DISTANCE_PX", "").strip():
              float(os.environ["MAX_MATCH_DISTANCE_PX"])
          if os.environ.get("BELT_REGION", "").strip():
              region = [int(part.strip()) for part in os.environ["BELT_REGION"].split(",")]
              assert len(region) == 4, region
              checks["belt_region"] = region
          print(json.dumps(checks, indent=2))
          PY

  apply-beltmap:
    name: Apply BeltMap
    needs: preflight
    runs-on: [self-hosted, linux]
    timeout-minutes: 360

    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: |
          python -m venv .poetry-bootstrap
          .poetry-bootstrap/bin/python -m pip install --upgrade pip
          .poetry-bootstrap/bin/python -m pip install "poetry==${POETRY_VERSION}"
          echo "$PWD/.poetry-bootstrap/bin" >> "$GITHUB_PATH"
          .poetry-bootstrap/bin/poetry --version

      - name: Install BeltMap and runtime dependencies
        env:
          BELTMAP_IMPLEMENTATION: ${{ inputs.implementation }}
        run: |
          rm -rf .venv
          case "$BELTMAP_IMPLEMENTATION" in
            scikit-image)
              poetry install --with test --extras speed
              ;;
            numpy)
              poetry install --with test
              ;;
            *)
              echo "Unsupported implementation: $BELTMAP_IMPLEMENTATION" >&2
              exit 64
              ;;
          esac
          poetry run python - <<'PY'
          import importlib.util
          import os

          import numpy as np

          implementation = os.environ["BELTMAP_IMPLEMENTATION"]
          skimage_spec = importlib.util.find_spec("skimage")
          print(f"selected implementation: {implementation}")
          print(f"numpy {np.__version__}")
          if skimage_spec is None:
              print("scikit-image not installed")
          else:
              import skimage

              print(f"scikit-image {skimage.__version__}")
          if implementation == "scikit-image" and skimage_spec is None:
              raise SystemExit("scikit-image implementation selected, but scikit-image is not installed")
          if implementation == "numpy" and skimage_spec is not None:
              raise SystemExit("numpy implementation selected, but scikit-image is unexpectedly installed")
          PY
          poetry run pytest -q

      - name: Prepare Zenodo dataset from local runner dataset cache
        env:
          DATASET_URL: ${{ inputs.dataset_url }}
        run: |
          set -euo pipefail

          DATASET_CACHE_ROOT="$HOME/.cache/datasets"
          DATASET_NAME="images_Brick_10gpers"
          CACHE_IMAGES="$DATASET_CACHE_ROOT/$DATASET_NAME"
          CACHE_ZIP="$DATASET_CACHE_ROOT/$DATASET_NAME.zip"
          CACHE_TMP="$DATASET_CACHE_ROOT/$DATASET_NAME.tmp"

          mkdir -p "$DATASET_CACHE_ROOT" data outputs

          if find "$CACHE_IMAGES" -type f 2>/dev/null | grep -q .; then
            echo "Local extracted dataset cache hit: $CACHE_IMAGES"
          else
            echo "Local extracted dataset cache miss or empty: $CACHE_IMAGES"
            rm -rf "$CACHE_TMP"
            mkdir -p "$CACHE_TMP"
            if [ ! -s "$CACHE_ZIP" ]; then
              echo "Local dataset zip cache miss; downloading Zenodo zip to $CACHE_ZIP"
              rm -f "$CACHE_ZIP.tmp"
              curl -L --fail --retry 5 --retry-delay 10 --connect-timeout 30 \
                -o "$CACHE_ZIP.tmp" "$DATASET_URL"
              mv "$CACHE_ZIP.tmp" "$CACHE_ZIP"
            else
              echo "Local dataset zip cache hit: $CACHE_ZIP"
            fi
            echo "Extracting dataset atomically to $CACHE_IMAGES"
            poetry run python -c \
              'import sys; from zipfile import ZipFile; ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
              "$CACHE_ZIP" "$CACHE_TMP"
            rm -rf "$CACHE_IMAGES"
            mv "$CACHE_TMP" "$CACHE_IMAGES"
          fi

          rm -rf data/images data/images_Brick_10gpers.zip
          ln -s "$CACHE_IMAGES" data/images
          if [ -s "$CACHE_ZIP" ]; then
            ln -s "$CACHE_ZIP" data/images_Brick_10gpers.zip
          fi

          echo "Dataset size summary:"
          du -sh "$CACHE_IMAGES" data/images data/images_Brick_10gpers.zip 2>/dev/null || true
          echo "Number of extracted image files:"
          find data/images -type f | wc -l
          echo "First files in extracted dataset:"
          find data/images -type f | sed -n '1,20p'

      - name: Run BeltMap through CLI config
        env:
          BELT_REGION: ${{ inputs.belt_region }}
          BELT_VELOCITY_PX_PER_FRAME: ${{ inputs.belt_velocity_px_per_frame }}
          BELT_PERIOD_PX: ${{ inputs.belt_period_px }}
          DETECTION_THRESHOLD: ${{ inputs.detection_threshold }}
          MIN_AREA_PX: ${{ inputs.min_area_px }}
          MIN_TRACK_LENGTH: ${{ inputs.min_track_length }}
          MAX_MATCH_DISTANCE_PX: ${{ inputs.max_match_distance_px }}
          MAX_FRAMES: ${{ inputs.max_frames }}
          FRAME_STRIDE: ${{ inputs.frame_stride }}
          MAP_SAMPLE_FRAMES: ${{ inputs.map_sample_frames }}
          MAP_MASK_ITERATIONS: ${{ inputs.map_mask_iterations }}
          MAP_PARTICLE_MASK_MODE: ${{ inputs.map_particle_mask_mode }}
          MAP_PARTICLE_MASK_THRESHOLD: ${{ inputs.map_particle_mask_threshold }}
          MAP_PARTICLE_MASK_GROW_THRESHOLD: ${{ inputs.map_particle_mask_grow_threshold }}
          MAP_PARTICLE_MASK_DILATION_PX: ${{ inputs.map_particle_mask_dilation_px }}
          MAP_PARTICLE_MASK_MARGIN_PX: ${{ inputs.map_particle_mask_margin_px }}
          MAP_PARTICLE_MASK_MIN_AREA_PX: ${{ inputs.map_particle_mask_min_area_px }}
          REGISTRATION_SEARCH_RADIUS_PX: ${{ inputs.registration_search_radius_px }}
          REGISTRATION_SEARCH_STEP_PX: ${{ inputs.registration_search_step_px }}
          PHASE_REFINEMENT_ITERATIONS: ${{ inputs.phase_refinement_iterations }}
          PHASE_REFINEMENT_MIN_SCORE: ${{ inputs.phase_refinement_min_score }}
          PHASE_REFINEMENT_MAX_ABS_CORRECTION_PX: ${{ inputs.phase_refinement_max_abs_correction_px }}
          PHASE_REFINEMENT_SMOOTHING_WINDOW_FRAMES: ${{ inputs.phase_refinement_smoothing_window_frames }}
          VELOCITY_SEARCH_RADIUS_PX: ${{ inputs.velocity_search_radius_px }}
          PROGRESS_INTERVAL_FRAMES: ${{ inputs.progress_interval_frames }}
          PARTIAL_OUTPUT_INTERVAL_FRAMES: ${{ inputs.partial_output_interval_frames }}
          DEBUG_RESIDUAL_PREVIEW_FRAMES: ${{ inputs.debug_residual_preview_frames }}
          DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES: ${{ inputs.debug_residual_preview_interval_frames }}
        run: |
          poetry run python - <<'PY'
          import json
          import os
          from pathlib import Path

          def env_value(name: str) -> str:
              return os.environ.get(name, "").strip()

          def append_value(
              lines: list[str],
              key: str,
              env_name: str,
              *,
              optional: bool = False,
          ) -> None:
              value = env_value(env_name)
              if optional and value == "":
                  return
              lines.append(f"{key} = {json.dumps(value)}")

          lines: list[str] = []
          lines.extend(["[paths]", 'image_dir = "data/images"', 'output_dir = "outputs"', ""])

          lines.append("[frames]")
          append_value(lines, "max_frames", "MAX_FRAMES")
          append_value(lines, "stride", "FRAME_STRIDE")
          lines.append("")

          lines.append("[belt]")
          append_value(lines, "region", "BELT_REGION", optional=True)
          append_value(lines, "velocity_px_per_frame", "BELT_VELOCITY_PX_PER_FRAME")
          append_value(lines, "period_px", "BELT_PERIOD_PX", optional=True)
          lines.append("")

          lines.append("[detection]")
          append_value(lines, "threshold", "DETECTION_THRESHOLD")
          append_value(lines, "min_area_px", "MIN_AREA_PX")
          lines.append("")

          lines.append("[tracking]")
          append_value(lines, "min_track_length", "MIN_TRACK_LENGTH")
          append_value(lines, "max_match_distance_px", "MAX_MATCH_DISTANCE_PX", optional=True)
          lines.append("")

          lines.append("[map]")
          append_value(lines, "sample_frames", "MAP_SAMPLE_FRAMES")
          append_value(lines, "mask_iterations", "MAP_MASK_ITERATIONS")
          append_value(lines, "particle_mask_mode", "MAP_PARTICLE_MASK_MODE")
          append_value(lines, "particle_mask_threshold", "MAP_PARTICLE_MASK_THRESHOLD")
          append_value(lines, "particle_mask_grow_threshold", "MAP_PARTICLE_MASK_GROW_THRESHOLD")
          append_value(lines, "particle_mask_dilation_px", "MAP_PARTICLE_MASK_DILATION_PX")
          append_value(lines, "particle_mask_margin_px", "MAP_PARTICLE_MASK_MARGIN_PX")
          append_value(lines, "particle_mask_min_area_px", "MAP_PARTICLE_MASK_MIN_AREA_PX")
          lines.append("")

          lines.append("[registration]")
          append_value(lines, "search_radius_px", "REGISTRATION_SEARCH_RADIUS_PX")
          append_value(lines, "search_step_px", "REGISTRATION_SEARCH_STEP_PX")
          lines.append("")

          lines.append("[phase_refinement]")
          append_value(lines, "iterations", "PHASE_REFINEMENT_ITERATIONS")
          append_value(lines, "min_score", "PHASE_REFINEMENT_MIN_SCORE")
          append_value(lines, "max_abs_correction_px", "PHASE_REFINEMENT_MAX_ABS_CORRECTION_PX")
          append_value(lines, "smoothing_window_frames", "PHASE_REFINEMENT_SMOOTHING_WINDOW_FRAMES")
          lines.append("")

          lines.append("[auto_velocity]")
          append_value(lines, "search_radius_px", "VELOCITY_SEARCH_RADIUS_PX")
          lines.append("")

          lines.append("[progress]")
          append_value(lines, "interval_frames", "PROGRESS_INTERVAL_FRAMES")
          append_value(lines, "partial_output_interval_frames", "PARTIAL_OUTPUT_INTERVAL_FRAMES")
          lines.append("")

          lines.append("[debug]")
          append_value(lines, "residual_preview_frames", "DEBUG_RESIDUAL_PREVIEW_FRAMES")
          append_value(lines, "residual_preview_interval_frames", "DEBUG_RESIDUAL_PREVIEW_INTERVAL_FRAMES")

          config_path = Path("beltmap-run.toml")
          config_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(config_path.read_text(encoding="utf-8"))
          PY

          poetry run beltmap-apply --config beltmap-run.toml --print-config

      - name: Upload BeltMap outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: beltmap-brick-10gpers-${{ inputs.implementation }}-results
          path: outputs/**
          if-no-files-found: warn
          retention-days: 14
