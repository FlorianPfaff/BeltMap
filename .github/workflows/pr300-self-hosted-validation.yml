name: PR 300 self-hosted validation

on:
  push:
    branches:
      - cleanup/consolidate-substantive-fixes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr300-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full Python 3.11 test suite
    runs-on:
      - self-hosted
      - Linux
      - X64
      - nvidia-smi
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Compile changed Python sources
        run: python -m compileall -q beltmap tests

      - name: Run full test suite
        run: python -m pytest
