name: YOLO11 BeltMap autosmoke

run-name: YOLO11 BeltMap autosmoke ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/yolo11-beltmap-autosmoke.yml"
      - ".github/triggers/yolo11-beltmap-autosmoke.txt"
      - "data/labels/brick20g_yolo_smoke_labels.json"

permissions:
  contents: read

concurrency:
  group: yolo11-beltmap-autosmoke-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: "Agg"
  PYTHON_VERSION: "3.11"
  DATASET_NAME: "images_BrickandSandLimeBrick_50vs50_20gpers"
  ZENODO_RECORD_ID: "7801882"
  RECORD_FILE_GLOB: "images_*.zip"
  TRUTH_PATH: "data/labels/brick20g_yolo_smoke_labels.json"
  BELT_REGION: "0,220,1330,1800"
  MAX_FRAMES: "13"
  YOLO_MODEL: "yolo11n.pt"
  YOLO_EPOCHS: "1"
  YOLO_IMGSZ: "640"
  YOLO_BATCH: "1"

jobs:
  autosmoke:
    name: Build tiny YOLO dataset and run one-epoch YOLO11 smoke train
    runs-on: [self-hosted, Linux]
    timeout-minutes: 240

    steps:
      - name: Check out BeltMap
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install BeltMap and YOLO smoke dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[speed]"
          python -m pip install --upgrade "ultralytics>=8.3.0" "opencv-python-headless>=4.9" "pyyaml>=6"
          python - <<'PY'
          import importlib
          for name in ("beltmap", "ultralytics", "PIL", "yaml", "cv2"):
              importlib.import_module(name)
              print(f"import ok: {name}")
          PY

      - name: Prepare Zenodo data
        run: |
          set -euo pipefail
          mkdir -p data outputs
          beltmap-prepare-zenodo \
            --record-id "$ZENODO_RECORD_ID" \
            --record-file-glob "$RECORD_FILE_GLOB" \
            --dataset-name "$DATASET_NAME" \
            --image-link data/images \
            --zip-link "data/${DATASET_NAME}.zip" \
            --manifest-path outputs/dataset_manifest.json
          echo "Dataset image count:"
          find -L data/images -type f | wc -l

      - name: Build tiny YOLO dataset
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import os
          import re
          from pathlib import Path

          import yaml
          from PIL import Image

          image_exts = {".bmp", ".png", ".jpg", ".jpeg", ".tif", ".tiff"}
          splits = {0: "train", 3: "val", 12: "test"}

          def natural_key(path: Path):
              parts = re.split(r"(\d+)", str(path))
              return [int(part) if part.isdigit() else part.lower() for part in parts]

          def parse_crop(text: str) -> tuple[int, int, int, int]:
              parts = [int(float(part.strip())) for part in text.split(",")]
              if len(parts) != 4:
                  raise SystemExit(f"BELT_REGION must be top,left,height,width: {text!r}")
              return tuple(parts)

          def yolo_line(box: dict, *, crop_width: int, crop_height: int) -> str:
              top = max(0.0, min(float(box["top"]), float(crop_height)))
              left = max(0.0, min(float(box["left"]), float(crop_width)))
              bottom = max(0.0, min(float(box["bottom"]), float(crop_height)))
              right = max(0.0, min(float(box["right"]), float(crop_width)))
              if bottom <= top or right <= left:
                  raise ValueError(f"invalid clipped box: {box}")
              xc = 0.5 * (left + right) / crop_width
              yc = 0.5 * (top + bottom) / crop_height
              width = (right - left) / crop_width
              height = (bottom - top) / crop_height
              return f"0 {xc:.8f} {yc:.8f} {width:.8f} {height:.8f}"

          truth_path = Path(os.environ["TRUTH_PATH"])
          truth = json.loads(truth_path.read_text(encoding="utf-8"))
          if truth.get("status") != "reviewed_ground_truth" or truth.get("requires_manual_review"):
              raise SystemExit(f"truth file is not a reviewed fixture: {truth_path}")

          crop_top, crop_left, crop_height, crop_width = parse_crop(os.environ["BELT_REGION"])
          max_frames = int(os.environ["MAX_FRAMES"])
          images = sorted(
              (path for path in Path("data/images").rglob("*") if path.suffix.lower() in image_exts),
              key=natural_key,
          )[:max_frames]
          if len(images) <= max(splits):
              raise SystemExit(f"need at least {max(splits) + 1} images, got {len(images)}")

          particles_by_frame: dict[int, list[dict]] = {frame: [] for frame in splits}
          for particle in truth.get("particles", []):
              frame_index = int(particle["frame_index"])
              if frame_index in particles_by_frame:
                  particles_by_frame[frame_index].append(particle)
          if any(not particles_by_frame[frame] for frame in splits):
              raise SystemExit(f"missing particles for one or more smoke frames: {particles_by_frame}")

          root = Path("outputs/yolo11_beltmap_autosmoke/dataset")
          manifest_rows = []
          for frame_index, split in splits.items():
              image_path = images[frame_index]
              image_out = root / "images" / split / f"frame_{frame_index:06d}.png"
              label_out = root / "labels" / split / f"frame_{frame_index:06d}.txt"
              image_out.parent.mkdir(parents=True, exist_ok=True)
              label_out.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(image_path) as image:
                  crop = image.convert("L").crop(
                      (crop_left, crop_top, crop_left + crop_width, crop_top + crop_height)
                  )
                  crop.save(image_out)
              label_lines = [
                  yolo_line(box, crop_width=crop_width, crop_height=crop_height)
                  for box in particles_by_frame[frame_index]
              ]
              label_out.write_text("\n".join(label_lines) + "\n", encoding="utf-8")
              manifest_rows.append(
                  {
                      "frame_index": frame_index,
                      "split": split,
                      "source": str(image_path),
                      "image": str(image_out),
                      "label": str(label_out),
                      "n_boxes": len(label_lines),
                  }
              )

          data_yaml = {
              "path": str(root.resolve()),
              "train": "images/train",
              "val": "images/val",
              "test": "images/test",
              "names": {0: "particle"},
          }
          (root / "data.yaml").write_text(yaml.safe_dump(data_yaml, sort_keys=False), encoding="utf-8")
          output_root = Path("outputs/yolo11_beltmap_autosmoke")
          output_root.mkdir(parents=True, exist_ok=True)
          with (output_root / "dataset_manifest.csv").open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=list(manifest_rows[0]))
              writer.writeheader()
              writer.writerows(manifest_rows)
          (output_root / "dataset_summary.json").write_text(
              json.dumps(
                  {
                      "truth_path": str(truth_path),
                      "frames": sorted(splits),
                      "n_particles": sum(row["n_boxes"] for row in manifest_rows),
                      "crop": {"top": crop_top, "left": crop_left, "height": crop_height, "width": crop_width},
                      "data_yaml": str(root / "data.yaml"),
                      "purpose": "YOLO11 workflow smoke test only; not paper evidence.",
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          print((output_root / "dataset_summary.json").read_text(encoding="utf-8"))
          PY

      - name: Run one-epoch YOLO11 smoke training
        run: |
          set -euo pipefail
          yolo detect train \
            model="$YOLO_MODEL" \
            data=outputs/yolo11_beltmap_autosmoke/dataset/data.yaml \
            epochs="$YOLO_EPOCHS" \
            imgsz="$YOLO_IMGSZ" \
            batch="$YOLO_BATCH" \
            workers=0 \
            project=outputs/yolo11_beltmap_autosmoke/yolo_runs \
            name=smoke_train \
            exist_ok=True

      - name: Write smoke report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p outputs/yolo11_beltmap_autosmoke
          cat > outputs/yolo11_beltmap_autosmoke/README.md <<'EOF'
          # YOLO11 BeltMap autosmoke

          This run is a GitHub Actions smoke test for the YOLO11 BeltMap pilot infrastructure. It uses three reviewed crop-local frames from `data/labels/brick20g_yolo_smoke_labels.json` to verify:

          - Zenodo dataset preparation,
          - crop extraction,
          - YOLO-format label conversion,
          - Ultralytics YOLO11 installation,
          - one-epoch training on a tiny dataset.

          The output is not scientific evidence and must not be cited as paper metrics.
          EOF
          find outputs/yolo11_beltmap_autosmoke -maxdepth 5 -type f | sort > outputs/yolo11_beltmap_autosmoke/files.txt
          cat outputs/yolo11_beltmap_autosmoke/dataset_summary.json || true

      - name: Upload YOLO11 autosmoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yolo11-beltmap-autosmoke-${{ github.run_id }}
          path: outputs/yolo11_beltmap_autosmoke
          if-no-files-found: error
          retention-days: 14
