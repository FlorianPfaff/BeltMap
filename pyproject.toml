[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "beltmap"
version = "0.1.0"
description = "Conveyor-belt map reconstruction and phase estimation tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "pillow>=10",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
beltmap-apply = "beltmap.cli.apply:main"

[project.optional-dependencies]
test = [
    "pytest>=7",
]
speed = [
    "scipy>=1.10",
    "scikit-image>=0.21",
]

[tool.poetry]
packages = [
    { include = "beltmap" },
    { include = "scripts" },
]

[tool.poetry.group.test.dependencies]
pytest = ">=7"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
