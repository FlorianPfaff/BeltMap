[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "beltmap"
version = "0.1.0"
description = "Conveyor-belt map reconstruction and phase estimation tools"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
    { name = "Florian Pfaff" },
]
keywords = [
    "background-subtraction",
    "computer-vision",
    "conveyor-belt",
    "image-registration",
    "particle-localization",
    "particle-tracking",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=2.0",
    "pillow>=10",
    "pyrecest @ git+https://github.com/FlorianPfaff/PyRecEst.git@main",
]

[project.urls]
Homepage = "https://github.com/IPS-Stuttgart/BeltMap"
Repository = "https://github.com/IPS-Stuttgart/BeltMap"
Issues = "https://github.com/IPS-Stuttgart/BeltMap/issues"

[project.scripts]
beltmap-apply = "beltmap.cli.apply:main"
beltmap-validate = "beltmap.cli.validate_visual:main"
beltmap-benchmark = "beltmap.cli.benchmark:main"
beltmap-compare = "beltmap.cli.compare:main"
beltmap-texture-stress = "beltmap.cli.texture_stress:main"
beltmap-evaluate = "beltmap.cli.evaluate:main"
beltmap-filter-tracks = "beltmap.cli.filter_tracks:main"
beltmap-filter-recurrent-artifacts = "beltmap.cli.filter_recurrent_artifacts:main"
beltmap-trust = "beltmap.cli.trust:main"
beltmap-advanced-report = "beltmap.cli.advanced_report:main"
beltmap-evaluate-real = "beltmap.cli.evaluate_real:main"
beltmap-sweep = "beltmap.cli.sweep:main"
beltmap-synthetic-suite = "beltmap.cli.synthetic_suite:main"
beltmap-detect-roi = "beltmap.cli.detect_roi:main"
beltmap-estimate-period = "beltmap.cli.estimate_period:main"
beltmap-suggest-threshold = "beltmap.cli.suggest_threshold:main"
beltmap-manifest = "beltmap.cli.manifest:main"
beltmap-flux-summary = "beltmap.cli.flux_summary:main"
beltmap-review = "beltmap.cli.review:main"
beltmap-write-templates = "beltmap.cli.write_templates:main"
beltmap-stream-snapshot = "beltmap.cli.stream_snapshot:main"
beltmap-postrun-audit = "beltmap.cli.postrun_audit:main"
beltmap-map-uncertainty = "beltmap.cli.map_uncertainty:main"
beltmap-map-only-negative-control = "beltmap.cli.map_only_negative_control:main"
beltmap-suggest-label-frames = "beltmap.cli.suggest_label_frames:main"
beltmap-quality-contract = "beltmap.cli.quality_contract:main"
beltmap-prepare-zenodo = "beltmap.cli.prepare_zenodo_dataset:main"
beltmap-evaluate-tracklets = "beltmap.cli.evaluate_tracklets:main"

[project.optional-dependencies]
test = [
    "pytest>=7",
]
speed = [
    "scikit-image>=0.26.0",
]

[tool.poetry]
packages = [
    { include = "beltmap" },
]

[tool.poetry.group.test.dependencies]
pytest = ">=9.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
