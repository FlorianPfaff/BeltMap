[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beltmap"
version = "0.1.0"
description = "Conveyor-belt map reconstruction and phase estimation tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["beltmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
